<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Tunnel Story Reader - Indexed Sync</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #121212; color: #e0e0e0; padding: 12px; margin: 0; box-sizing: border-box; }
        .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; background: #1e1e1e; padding: 12px; border-radius: 10px; border: 1px solid #333; }
        button { background-color: #3a3a3a; color: white; border: none; padding: 9px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; }
        button:active { opacity: 0.7; }
        .btn-play { background-color: #4CAF50; }
        .btn-stop { background-color: #f44336; }
        .btn-pip { background-color: #2196F3; }
        select, input[type="file"] { padding: 8px; background-color: #2d2d2d; color: white; border: 1px solid #555; border-radius: 6px; font-size: 14px; max-width: 100%; }
        
        #storyContainer { width: 100%; height: 52vh; background-color: #1a1a1a; color: #9e9e9e; font-size: 17px; line-height: 1.65; padding: 14px; border: 1px solid #333; border-radius: 10px; box-sizing: border-box; overflow-y: auto; margin-bottom: 10px; }
        #storyContainer p { margin: 0 0 12px 0; padding: 8px 10px; border-radius: 8px; transition: background-color 0.2s, color 0.2s; cursor: pointer; border-left: 3px solid transparent; }
        #storyContainer p.active-chunk { background-color: rgba(76, 175, 80, 0.22); color: #ffffff; font-weight: 600; border-left: 3px solid #4CAF50; }
        
        #pipVideo { width: 100%; height: 150px; background: #000; border-radius: 8px; object-fit: cover; }
        #status { font-size: 13px; color: #ffeb3b; width: 100%; margin-top: 4px; font-weight: 600; }
    </style>
</head>
<body>

    <div class="toolbar">
        <input type="file" id="fileInput" accept=".txt,.epub" onclick="this.value=null;">
        
        <select id="chapterSelect" style="display: none; width: 100%;" onchange="onChapterChange()"></select>

        <select id="speedSelect" onchange="updateSpeed()">
            <option value="0.8">Chậm (0.8x)</option>
            <option value="1.0" selected>Bình thường (1.0x)</option>
            <option value="1.25">Hơi nhanh (1.25x)</option>
            <option value="1.5">Nhanh (1.5x)</option>
            <option value="1.75">Rất nhanh (1.75x)</option>
            <option value="2.0">Nhanh gấp đôi (2.0x)</option>
        </select>

        <button class="btn-play" onclick="startTTS(0)">▶ Đọc</button>
        <button class="btn-pip" onclick="togglePiP()">🔲 Bật PiP</button>
        <button class="btn-stop" onclick="stopTTS()">■ Dừng</button>
        <div id="status">Sẵn sàng! Hãy chọn file truyện (.txt hoặc .epub).</div>
    </div>

    <div id="storyContainer">Nội dung truyện sẽ hiển thị ở đây sau khi bạn chọn file...</div>
    
    <video id="pipVideo" controls playsinline muted></video>

    <script>
        const SERVER_URL = "https://comparing-tobacco-elvis-allied.trycloudflare.com/tts";

        const fileInput = document.getElementById('fileInput');
        const storyContainer = document.getElementById('storyContainer');
        const status = document.getElementById('status');
        const chapterSelect = document.getElementById('chapterSelect');
        const speedSelect = document.getElementById('speedSelect');
        const pipVideo = document.getElementById('pipVideo');

        let chapters = []; // Mỗi chapter: { title: string, paragraphs: string[] }
        let currentChapterIndex = 0;
        let chunks = []; // Mảng đoạn văn của chương hiện tại (khớp 1-1 với thẻ <p>)
        let currentChunkIndex = 0;

        // Quản lý Audio đơn nhất & Bộ đệm theo Index (Chống nhảy cóc 100%)
        const player = new Audio();
        player.playsInline = true;
        let isPlaying = false;
        let playSessionId = 0; // Khóa phiên chống đè bất đồng bộ
        let audioCache = {};   // Map: index -> Promise<blobUrl>
        let resolvedUrls = {}; // Map: index -> blobUrl (để thu hồi bộ nhớ)
        let canvasStreamInitialized = false;

        // --- 1. BÓC TÁCH ĐOẠN VĂN CHUẨN TỪ HTML CỦA EPUB ---
        function extractParagraphsFromHtml(htmlContent, fallbackTitle) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlContent, "text/html");

            let title = fallbackTitle;
            const hTag = doc.querySelector("h1, h2, h3, title");
            if (hTag && hTag.textContent.trim()) {
                title = hTag.textContent.replace(/\s+/g, ' ').trim();
            }

            // Thay thế thẻ <br> bằng ký tự xuống dòng để không bị dính chữ
            doc.querySelectorAll("br").forEach(br => br.replaceWith("\n"));
            // Đảm bảo kết thúc mỗi thẻ block đều có ký tự xuống dòng
            doc.querySelectorAll("p, div, h1, h2, h3, h4, li, blockquote").forEach(el => {
                el.appendChild(doc.createTextNode("\n"));
            });

            const rawText = doc.body ? doc.body.textContent : doc.textContent;
            const paragraphs = processRawTextToChunks(rawText, title);
            return { title: title.substring(0, 60), paragraphs };
        }

        // Chia văn bản thô thành các đoạn vừa phải, giữ nguyên thứ tự 1-1
        function processRawTextToChunks(rawText, chapterTitle) {
            const rawLines = rawText.split(/\r?\n/);
            const cleanLines = [];

            for (let line of rawLines) {
                let trimmed = line.replace(/\s+/g, ' ').trim();
                if (trimmed.length > 0) {
                    cleanLines.push(trimmed);
                }
            }

            // Nếu dòng đầu tiên chưa có tiêu đề chương thì chèn tiêu đề vào làm đoạn 0
            if (chapterTitle && cleanLines.length > 0 && !cleanLines[0].toLowerCase().includes(chapterTitle.toLowerCase().substring(0, 15))) {
                cleanLines.unshift(chapterTitle);
            }

            // Tách các đoạn quá dài (> 500 ký tự) theo dấu chấm câu để server TTS không bị timeout,
            // NHƯNG tách ngay từ bước tạo mảng hiển thị để DOM và Audio luôn khớp 1-1!
            const finalChunks = [];
            for (let para of cleanLines) {
                if (para.length <= 500) {
                    finalChunks.push(para);
                } else {
                    const sentences = para.split(/(?<=[.?!;…”"'])\s+/);
                    let currentBuf = "";
                    for (let s of sentences) {
                        if ((currentBuf + " " + s).trim().length > 450) {
                            if (currentBuf.trim()) finalChunks.push(currentBuf.trim());
                            currentBuf = s;
                        } else {
                            currentBuf = (currentBuf + " " + s).trim();
                        }
                    }
                    if (currentBuf.trim()) finalChunks.push(currentBuf.trim());
                }
            }
            return finalChunks;
        }

        // --- 2. XỬ LÝ CHỌN FILE (.TXT / .EPUB) ---
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            stopTTS();
            status.textContent = `⏳ Đang phân tích file: ${file.name}...`;
            storyContainer.innerHTML = "Đang tải nội dung...";
            chapters = [];
            chapterSelect.style.display = "none";
            chapterSelect.innerHTML = "";

            try {
                if (file.name.toLowerCase().endsWith('.txt')) {
                    const text = await file.text();
                    const splits = text.split(/(?=^(?:Chương|Hồi|Quyển|Chapter)\s+\d+)/im);

                    if (splits.length <= 1) {
                        chapters.push({
                            title: "Toàn bộ nội dung",
                            paragraphs: processRawTextToChunks(text, "")
                        });
                    } else {
                        splits.forEach((content, idx) => {
                            if (content.trim()) {
                                let firstLine = content.trim().split(/\r?\n/)[0].trim();
                                let title = firstLine.length > 50 ? firstLine.substring(0, 50) + "..." : (firstLine || `Chương ${idx + 1}`);
                                chapters.push({
                                    title: title,
                                    paragraphs: processRawTextToChunks(content, "")
                                });
                            }
                        });
                    }
                } else if (file.name.toLowerCase().endsWith('.epub')) {
                    const zip = await JSZip.loadAsync(file);
                    const containerFile = zip.file("META-INF/container.xml") || zip.file("meta-inf/container.xml");
                    if (!containerFile) throw new Error("File EPUB không hợp lệ (thiếu container.xml)");

                    const containerXml = await containerFile.async("text");
                    const parser = new DOMParser();
                    const containerDoc = parser.parseFromString(containerXml, "text/xml");
                    const rootfile = containerDoc.querySelector("rootfile");
                    const opfPath = rootfile.getAttribute("full-path");
                    const basePath = opfPath.includes('/') ? opfPath.substring(0, opfPath.lastIndexOf('/') + 1) : "";

                    const opfFile = zip.file(opfPath);
                    const opfXml = await opfFile.async("text");
                    const opfDoc = parser.parseFromString(opfXml, "text/xml");

                    const manifest = {};
                    opfDoc.querySelectorAll("manifest > item").forEach(item => {
                        manifest[item.getAttribute("id")] = item.getAttribute("href");
                    });

                    const spineItems = opfDoc.querySelectorAll("spine > itemref");
                    for (let i = 0; i < spineItems.length; i++) {
                        const idref = spineItems[i].getAttribute("idref");
                        const href = manifest[idref];
                        if (href) {
                            const filePath = basePath + decodeURIComponent(href);
                            const fileInZip = zip.file(filePath) || zip.file(filePath.replace(/^\//, ''));
                            if (fileInZip) {
                                const htmlContent = await fileInZip.async("text");
                                const extracted = extractParagraphsFromHtml(htmlContent, `Chương ${i + 1}`);
                                if (extracted.paragraphs.length > 0) {
                                    chapters.push(extracted);
                                }
                            }
                        }
                    }
                }

                if (chapters.length === 0) throw new Error("Không tìm thấy văn bản trong file.");

                chapters.forEach((chap, idx) => {
                    const opt = document.createElement("option");
                    opt.value = idx;
                    opt.textContent = chap.title;
                    chapterSelect.appendChild(opt);
                });

                chapterSelect.style.display = "block";
                chapterSelect.value = 0;
                renderChapter(0);
                status.textContent = `✅ Đã tải xong ${chapters.length} chương! Bấm "Đọc" hoặc chạm vào đoạn bất kỳ.`;
            } catch (err) {
                console.error(err);
                status.textContent = `❌ Lỗi đọc file: ${err.message}`;
            }
        });

        // --- 3. HIỂN THỊ CHƯƠNG LÊN MÀN HÌNH ---
        function onChapterChange() {
            const wasPlaying = isPlaying;
            stopTTS();
            renderChapter(parseInt(chapterSelect.value));
            if (wasPlaying) {
                startTTS(0);
            }
        }

        function renderChapter(index) {
            currentChapterIndex = index;
            const chap = chapters[currentChapterIndex];
            if (!chap) return;

            // Mảng chunks dùng để đọc TTS chính là mảng dựng giao diện <p> -> Khớp 100%
            chunks = chap.paragraphs;
            currentChunkIndex = 0;

            storyContainer.innerHTML = chunks.map((text, idx) =>
                `<p id="para-${idx}" onclick="jumpToChunk(${idx})">${text}</p>`
            ).join('');
            storyContainer.scrollTop = 0;
        }

        // Cho phép người dùng bấm trực tiếp vào bất kỳ đoạn nào để đọc từ đoạn đó
        function jumpToChunk(index) {
            startTTS(index);
        }

        // --- 4. BỘ ĐỆM TẢI TRƯỚC THEO CHỈ SỐ (INDEXED PREFETCH) ---
        function clearAudioCache() {
            audioCache = {};
            for (let key in resolvedUrls) {
                URL.revokeObjectURL(resolvedUrls[key]);
            }
            resolvedUrls = {};
        }

        async function fetchAudioFromServer(text, session, retries = 3) {
            for (let i = 0; i < retries; i++) {
                if (session !== playSessionId) throw new Error("Cancelled");
                try {
                    const response = await fetch(SERVER_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: text })
                    });
                    if (!response.ok) throw new Error("HTTP " + response.status);
                    const blob = await response.blob();
                    if (blob.size < 100) throw new Error("Empty audio");
                    return URL.createObjectURL(blob);
                } catch (err) {
                    if (session !== playSessionId) throw err;
                    if (i === retries - 1) throw err;
                    await new Promise(r => setTimeout(r, 700));
                }
            }
        }

        // Lấy hoặc tải đoạn âm thanh tại đúng vị trí index
        function getChunkAudioPromise(index, session) {
            if (index >= chunks.length) return null;
            if (!audioCache[index]) {
                audioCache[index] = fetchAudioFromServer(chunks[index], session).then(url => {
                    if (session === playSessionId) {
                        resolvedUrls[index] = url;
                    }
                    return url;
                }).catch(err => {
                    delete audioCache[index]; // Xóa để có thể thử lại nếu lỗi mạng
                    throw err;
                });
            }
            return audioCache[index];
        }

        // --- 5. TRÌNH PHÁT ĐỒNG BỘ TUYỆT ĐỐI ---
        async function startTTS(startIndex = 0) {
            if (chunks.length === 0) {
                alert("Vui lòng chọn file truyện trước!");
                return;
            }

            // Tăng khóa phiên để hủy mọi tiến trình ngầm cũ
            playSessionId++;
            const currentSession = playSessionId;

            player.pause();
            clearAudioCache();

            currentChunkIndex = startIndex;
            isPlaying = true;

            // Mở khóa Audio iOS ngay trong thao tác chạm
            player.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
            player.play().catch(() => {});

            initCanvasPiP();

            await playLoop(currentSession);
        }

        async function playLoop(session) {
            while (isPlaying && session === playSessionId && currentChunkIndex < chunks.length) {
                const idx = currentChunkIndex;

                // 1. Highlight & Cuộn tới đúng đoạn văn bản đang chuẩn bị đọc
                highlightParagraph(idx);
                status.textContent = `⏳ Đang tải (${idx + 1}/${chunks.length})...`;

                // 2. Kích hoạt tải ngầm trước 2 đoạn tiếp theo (idx + 1 và idx + 2)
                if (idx + 1 < chunks.length) getChunkAudioPromise(idx + 1, session).catch(() => {});
                if (idx + 2 < chunks.length) getChunkAudioPromise(idx + 2, session).catch(() => {});

                // 3. Đợi đoạn hiện tại (idx) sẵn sàng
                let audioUrl;
                try {
                    audioUrl = await getChunkAudioPromise(idx, session);
                } catch (err) {
                    if (session !== playSessionId || !isPlaying) return;
                    status.textContent = `⚠️ Mạng chập chờn, đang thử lại đoạn ${idx + 1}...`;
                    await new Promise(r => setTimeout(r, 1500));
                    continue; // Thử lại đúng đoạn idx này, không nhảy cóc!
                }

                if (session !== playSessionId || !isPlaying) return;

                // 4. Phát âm thanh và đợi đến khi đọc xong hoàn toàn đoạn idx
                status.textContent = `🔊 ${chapters[currentChapterIndex].title} (${idx + 1}/${chunks.length})`;
                await playSingleAudio(audioUrl, session);

                // Thu hồi bộ nhớ của đoạn vừa đọc xong
                if (resolvedUrls[idx]) {
                    URL.revokeObjectURL(resolvedUrls[idx]);
                    delete resolvedUrls[idx];
                    delete audioCache[idx];
                }

                if (session !== playSessionId || !isPlaying) return;

                // 5. Chỉ tăng đúng 1 đơn vị khi đã phát xong
                currentChunkIndex++;
            }

            // Chuyển chương tự động khi đọc hết mảng chunks
            if (isPlaying && session === playSessionId && currentChunkIndex >= chunks.length) {
                if (currentChapterIndex < chapters.length - 1) {
                    status.textContent = "⏭ Đang chuyển sang chương tiếp theo...";
                    currentChapterIndex++;
                    chapterSelect.value = currentChapterIndex;
                    renderChapter(currentChapterIndex);
                    startTTS(0);
                } else {
                    status.textContent = "✅ Đã đọc hết toàn bộ truyện!";
                    isPlaying = false;
                }
            }
        }

        function playSingleAudio(url, session) {
            return new Promise((resolve) => {
                if (session !== playSessionId || !isPlaying) {
                    resolve();
                    return;
                }

                player.onended = null;
                player.onerror = null;

                player.src = url;
                player.playbackRate = parseFloat(speedSelect.value);

                const finish = () => {
                    player.onended = null;
                    player.onerror = null;
                    resolve();
                };

                player.onended = finish;
                player.onerror = finish;

                player.play().catch(() => {
                    finish();
                });
            });
        }

        function highlightParagraph(index) {
            document.querySelectorAll('#storyContainer p.active-chunk').forEach(p => {
                p.classList.remove('active-chunk');
            });

            const activePara = document.getElementById(`para-${index}`);
            if (activePara) {
                activePara.classList.add('active-chunk');
                activePara.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function updateSpeed() {
            player.playbackRate = parseFloat(speedSelect.value);
        }

        function stopTTS() {
            playSessionId++; // Hủy ngay lập tức vòng lặp playLoop đang chạy
            isPlaying = false;
            player.onended = null;
            player.onerror = null;
            player.pause();
            player.src = "";
            clearAudioCache();
            status.textContent = "⏹ Đã dừng đọc.";
        }

        // --- 6. CANVAS VIDEO STREAM CHO PIP CHẠY NGẦM TRÊN IOS ---
        function initCanvasPiP() {
            if (canvasStreamInitialized) {
                pipVideo.play().catch(() => {});
                return;
            }
            canvasStreamInitialized = true;

            const canvas = document.createElement('canvas');
            canvas.width = 400;
            canvas.height = 180;
            const ctx = canvas.getContext('2d');

            function drawFrame() {
                ctx.fillStyle = '#111';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = isPlaying ? '#4CAF50' : '#888';
                ctx.font = 'bold 20px sans-serif';
                ctx.fillText(isPlaying ? "🔊 Đang đọc truyện..." : "⏸ Đã tạm dừng", 20, 45);

                ctx.fillStyle = '#ffeb3b';
                ctx.font = '15px sans-serif';
                let title = chapters[currentChapterIndex] ? chapters[currentChapterIndex].title : "";
                ctx.fillText(title.substring(0, 34), 20, 85);

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText(`Đoạn: ${currentChunkIndex + 1} / ${chunks.length}`, 20, 125);

                requestAnimationFrame(drawFrame);
            }
            drawFrame();

            const stream = canvas.captureStream(15);
            pipVideo.srcObject = stream;
            pipVideo.play().catch(() => {});
        }

        async function togglePiP() {
            try {
                initCanvasPiP();
                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                } else if (pipVideo.webkitSupportsPresentationMode) {
                    // Chuẩn riêng của iOS Safari
                    pipVideo.webkitSetPresentationMode(
                        pipVideo.webkitPresentationMode === "picture-in-picture" ? "inline" : "picture-in-picture"
                    );
                } else {
                    await pipVideo.requestPictureInPicture();
                }
            } catch (err) {
                alert("Hãy bấm nút 'Đọc' trước rồi bấm Bật PiP nhé!");
            }
        }
    </script>
</body>
</html>
