<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Story Reader Pro - Multi-Voice & Bookshelf</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #131b2e;
            --bg-elevated: #1c263b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.25);
            --border: #1e293b;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header */
        header {
            background: rgba(19, 27, 46, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            z-index: 20;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 15px;
            color: var(--accent);
            overflow: hidden;
        }
        .brand span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 145px;
        }
        .header-actions { display: flex; gap: 6px; align-items: center; }
        .pill-btn {
            background: var(--bg-elevated);
            color: var(--text-primary);
            border: 1px solid #334155;
            border-radius: 999px;
            padding: 6px 11px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .pill-btn.primary {
            background: rgba(16, 185, 129, 0.16);
            border-color: rgba(16, 185, 129, 0.4);
            color: #6ee7b7;
        }
        .pill-btn:active { opacity: 0.75; }

        /* Status Bar */
        .status-strip {
            background: #0f172a;
            border-bottom: 1px solid var(--border);
            padding: 6px 14px;
            font-size: 12px;
            color: #fbbf24;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        #statusText {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        #serverBadge {
            font-size: 11px;
            color: #34d399;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* Reader Viewport */
        #storyContainer {
            flex: 1;
            overflow-y: auto;
            padding: 18px 16px 175px 16px;
            max-width: 780px;
            width: 100%;
            margin: 0 auto;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 19px;
            line-height: 1.75;
            color: #94a3b8;
            scroll-behavior: smooth;
        }
        #storyContainer p {
            margin: 0 0 16px 0;
            padding: 12px 14px;
            border-radius: 12px;
            border-left: 3px solid transparent;
            transition: background-color 0.2s, color 0.2s;
            cursor: pointer;
        }
        #storyContainer p.active-chunk {
            background-color: rgba(16, 185, 129, 0.08);
            border-left-color: var(--accent);
            color: #cbd5e1;
        }
        /* Karaoke Word Highlight */
        .word-span {
            transition: color 0.08s ease, text-shadow 0.08s ease;
            border-radius: 3px;
        }
        .word-span.spoken {
            color: #34d399;
        }
        .word-span.current-word {
            color: #ffffff;
            background: rgba(16, 185, 129, 0.35);
            text-shadow: 0 0 8px rgba(52, 211, 153, 0.6);
        }

        /* Bottom Floating Player */
        .bottom-player {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(19, 27, 46, 0.96);
            backdrop-filter: blur(16px);
            border-top: 1px solid #334155;
            padding: 10px 14px calc(10px + env(safe-area-inset-bottom)) 14px;
            z-index: 30;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .player-inner {
            max-width: 780px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .progress-track {
            width: 100%;
            height: 4px;
            background: #1e293b;
            border-radius: 999px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #10b981, #34d399);
            transition: width 0.25s ease;
        }
        .selectors-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        select {
            background: var(--bg-elevated);
            color: var(--text-primary);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 7px 8px;
            font-size: 12px;
            outline: none;
        }
        #chapterSelect { flex: 1; min-width: 0; }
        #voiceSelect { max-width: 135px; }
        #speedSelect { width: 64px; text-align: center; }

        .controls-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
        }
        .ctrl-btn {
            background: var(--bg-elevated);
            color: var(--text-primary);
            border: 1px solid #334155;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .ctrl-btn:active { transform: scale(0.94); }
        .play-main-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            border: none;
            font-size: 20px;
            box-shadow: 0 4px 15px var(--accent-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .play-main-btn.playing {
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            box-shadow: 0 4px 15px rgba(244, 63, 94, 0.35);
        }

        /* Bookshelf Modal */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(4px);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 50;
        }
        .modal-backdrop.open { display: flex; }
        .modal-sheet {
            background: var(--bg-card);
            border-top: 1px solid #334155;
            border-radius: 18px 18px 0 0;
            width: 100%;
            max-width: 780px;
            max-height: 78vh;
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }
        .book-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .book-item {
            background: var(--bg-elevated);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .book-info { flex: 1; min-width: 0; }
        .book-title {
            font-weight: 700;
            font-size: 14px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .book-meta { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
        .book-actions { display: flex; gap: 6px; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            🎧 <span id="headerBookTitle">AI Story Reader</span>
        </div>
        <div class="header-actions">
            <button class="pill-btn" onclick="openBookshelf()">📚 Tủ sách</button>
            <label class="pill-btn primary">
                ＋ Thêm
                <input type="file" id="fileInput" accept=".txt,.epub" style="display:none;" onclick="this.value=null;">
            </label>
        </div>
    </header>

    <div class="status-strip">
        <div id="statusText">Sẵn sàng! Chọn truyện từ Tủ sách hoặc bấm ＋ Thêm.</div>
        <div id="serverBadge" onclick="changeServerUrl()">⚙ Server</div>
    </div>

    <div id="storyContainer">
        <div style="text-align:center; padding: 40px 10px; font-family: sans-serif; font-size: 15px;">
            <p style="font-size: 40px; margin-bottom: 10px;">📖</p>
            <p>Bấm <b>＋ Thêm</b> ở góc trên để mở file <b>.TXT</b> hoặc <b>.EPUB</b>.<br>Truyện sẽ tự động lưu vào <b>📚 Tủ sách</b> trên máy của bạn.</p>
        </div>
    </div>

    <div class="bottom-player">
        <div class="player-inner">
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <div class="selectors-row">
                <select id="chapterSelect" onchange="onChapterChange()">
                    <option value="0">Chưa có chương</option>
                </select>
                <select id="voiceSelect" onchange="onVoiceChange()" title="Chọn giọng đọc">
                    <option value="default">🎙 Mặc định</option>
                    <option value="Ngoc">👩 Nữ - Ngọc</option>
                    <option value="Huong">👩 Nữ - Hương</option>
                    <option value="Ly">👩 Nữ - Ly</option>
                    <option value="Binh">👨 Nam - Bình</option>
                    <option value="Tuyen">👨 Nam - Tuyến</option>
                    <option value="Vinh">👨 Nam - Vinh</option>
                </select>
                <select id="speedSelect" onchange="updateSpeed()" title="Tốc độ đọc">
                    <option value="0.8">0.8x</option>
                    <option value="1.0" selected>1.0x</option>
                    <option value="1.25">1.25x</option>
                    <option value="1.5">1.5x</option>
                    <option value="1.75">1.75x</option>
                    <option value="2.0">2.0x</option>
                </select>
            </div>

            <div class="controls-row">
                <button class="ctrl-btn" onclick="prevChunk()" title="Đoạn trước">⏮</button>
                <button class="play-main-btn" id="mainPlayBtn" onclick="togglePlayPause()">▶</button>
                <button class="ctrl-btn" onclick="nextChunk()" title="Đoạn sau">⏭</button>
            </div>
        </div>
    </div>

    <!-- Bookshelf Modal -->
    <div class="modal-backdrop" id="bookshelfModal" onclick="if(event.target===this) closeBookshelf()">
        <div class="modal-sheet">
            <div class="modal-header">
                <strong style="font-size:16px;">📚 Tủ sách đã lưu trên máy</strong>
                <button class="pill-btn" onclick="closeBookshelf()">✕ Đóng</button>
            </div>
            <div class="book-list" id="bookListContainer"></div>
        </div>
    </div>

    <script>
        // --- 1. CẤU HÌNH SERVER & GIỌNG ĐỌC ---
        let SERVER_BASE = localStorage.getItem("my_tts_server_url") || "http://localhost:5000";
        let SELECTED_VOICE = localStorage.getItem("my_tts_voice") || "default";
        const MAX_LEN = 400; // Tối ưu tốc độ phản hồi cho máy server yếu

        const serverBadge = document.getElementById('serverBadge');
        const statusText = document.getElementById('statusText');
        const voiceSelect = document.getElementById('voiceSelect');
        const chapterSelect = document.getElementById('chapterSelect');
        const speedSelect = document.getElementById('speedSelect');
        const storyContainer = document.getElementById('storyContainer');
        const mainPlayBtn = document.getElementById('mainPlayBtn');
        const progressFill = document.getElementById('progressFill');

        function getBaseUrl() {
            return SERVER_BASE.replace(/\/$/, "");
        }

        function getApiUrl() {
            return getBaseUrl() + "/tts";
        }

        function updateServerBadge() {
            serverBadge.textContent = SERVER_BASE.includes("trycloudflare.com") ? "● Tunnel OK" : "⚙ Đổi Link";
            localStorage.setItem("my_tts_server_url", SERVER_BASE);
        }

        async function loadServerVoices() {
            try {
                const res = await fetch(getBaseUrl() + "/voices");
                if (res.ok) {
                    const data = await res.json();
                    if (Array.isArray(data.voices) && data.voices.length > 0) {
                        voiceSelect.innerHTML = "";
                        data.voices.forEach(v => {
                            const opt = document.createElement("option");
                            opt.value = v.id;
                            opt.textContent = v.name;
                            voiceSelect.appendChild(opt);
                        });
                    }
                }
            } catch (e) {}
            if ([...voiceSelect.options].some(o => o.value === SELECTED_VOICE)) {
                voiceSelect.value = SELECTED_VOICE;
            }
        }

        function changeServerUrl() {
            let newUrl = prompt("Nhập link Cloudflare Tunnel mới (VD: https://xxxx.trycloudflare.com):", SERVER_BASE);
            if (newUrl && newUrl.trim()) {
                SERVER_BASE = newUrl.trim();
                updateServerBadge();
                clearAudioCache();
                loadServerVoices();
                statusText.textContent = "✅ Đã cập nhật Server: " + SERVER_BASE;
            }
        }

        function onVoiceChange() {
            SELECTED_VOICE = voiceSelect.value;
            localStorage.setItem("my_tts_voice", SELECTED_VOICE);
            const wasPlaying = isPlaying;
            const resumeIdx = currentChunkIndex;
            stopTTS(false);
            clearAudioCache();
            statusText.textContent = `🎙 Đã đổi sang giọng: ${voiceSelect.options.item(voiceSelect.selectedIndex).text}`;
            if (wasPlaying) {
                startTTS(resumeIdx);
            }
        }

        updateServerBadge();
        loadServerVoices();

        // --- 2. INDEXEDDB TỦ SÁCH LƯU TRUYỆN ---
        const DB_NAME = "AIStoryReaderDB";
        const DB_VERSION = 1;
        let dbInstance = null;
        let currentBookId = localStorage.getItem("last_open_book_id") || null;
        let currentBookTitle = "AI Story Reader";

        function openDatabase() {
            return new Promise((resolve, reject) => {
                if (dbInstance) return resolve(dbInstance);
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains("books")) {
                        db.createObjectStore("books", { keyPath: "id" });
                    }
                };
                req.onsuccess = (e) => {
                    dbInstance = e.target.result;
                    resolve(dbInstance);
                };
                req.onerror = (e) => reject(e.target.error);
            });
        }

        async function saveBookToDB(bookObj) {
            const db = await openDatabase();
            return new Promise((resolve, reject) => {
                const tx = db.transaction("books", "readwrite");
                tx.objectStore("books").put(bookObj);
                tx.oncomplete = () => resolve();
                tx.onerror = (e) => reject(e.target.error);
            });
        }

        async function getAllBooksFromDB() {
            const db = await openDatabase();
            return new Promise((resolve, reject) => {
                const tx = db.transaction("books", "readonly");
                const req = tx.objectStore("books").getAll();
                req.onsuccess = () => resolve(req.result || []);
                req.onerror = (e) => reject(e.target.error);
            });
        }

        async function getBookById(id) {
            const db = await openDatabase();
            return new Promise((resolve, reject) => {
                const tx = db.transaction("books", "readonly");
                const req = tx.objectStore("books").get(id);
                req.onsuccess = () => resolve(req.result || null);
                req.onerror = (e) => reject(e.target.error);
            });
        }

        async function deleteBookFromDB(id) {
            const db = await openDatabase();
            return new Promise((resolve, reject) => {
                const tx = db.transaction("books", "readwrite");
                tx.objectStore("books").delete(id);
                tx.oncomplete = () => resolve();
                tx.onerror = (e) => reject(e.target.error);
            });
        }

        async function saveReadingProgress() {
            if (!currentBookId || chapters.length === 0) return;
            try {
                const book = await getBookById(currentBookId);
                if (book) {
                    book.lastChapter = currentChapterIndex;
                    book.lastChunk = currentChunkIndex;
                    book.updatedAt = Date.now();
                    await saveBookToDB(book);
                }
            } catch (e) {}
        }

        async function openBookshelf() {
            const modal = document.getElementById("bookshelfModal");
            const container = document.getElementById("bookListContainer");
            modal.classList.add("open");
            container.innerHTML = "<p style='color:#94a3b8;font-size:13px;'>Đang tải tủ sách...</p>";

            const books = await getAllBooksFromDB();
            books.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

            if (books.length === 0) {
                container.innerHTML = "<p style='color:#94a3b8;font-size:13px;text-align:center;padding:20px;'>Tủ sách trống. Hãy bấm <b>＋ Thêm</b> để nạp truyện.</p>";
                return;
            }

            container.innerHTML = "";
            books.forEach(b => {
                const item = document.createElement("div");
                item.className = "book-item";
                const chapNum = (b.lastChapter || 0) + 1;
                const chunkNum = (b.lastChunk || 0) + 1;
                item.innerHTML = `
                    <div class="book-info">
                        <div class="book-title">${b.title}</div>
                        <div class="book-meta">${b.chapters.length} chương • Đang đọc: Chương ${chapNum} (Đoạn ${chunkNum})</div>
                    </div>
                    <div class="book-actions">
                        <button class="pill-btn primary" onclick="loadSavedBook('${b.id}')">Đọc tiếp</button>
                        <button class="pill-btn" style="color:#f87171;" onclick="removeSavedBook('${b.id}')">Xóa</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function closeBookshelf() {
            document.getElementById("bookshelfModal").classList.remove("open");
        }

        async function loadSavedBook(id) {
            const book = await getBookById(id);
            if (!book) return;
            stopTTS();
            currentBookId = book.id;
            currentBookTitle = book.title;
            localStorage.setItem("last_open_book_id", currentBookId);
            document.getElementById("headerBookTitle").textContent = book.title;

            chapters = book.chapters;
            populateChapterSelect();
            const targetChap = Math.min(book.lastChapter || 0, chapters.length - 1);
            chapterSelect.value = targetChap;
            renderChapter(targetChap, book.lastChunk || 0);
            closeBookshelf();
            statusText.textContent = `📖 Đã mở "${book.title}" (Chương ${targetChap + 1})`;
        }

        async function removeSavedBook(id) {
            await deleteBookFromDB(id);
            if (currentBookId === id) {
                currentBookId = null;
                localStorage.removeItem("last_open_book_id");
            }
            openBookshelf();
        }

        // --- 3. PHÂN TÍCH TXT / EPUB & NỐI CÂU THÔNG MINH ---
        let chapters = [];
        let currentChapterIndex = 0;
        let chunks = [];
        let currentChunkIndex = 0;

        const CHAPTER_REGEX = /^(?:Chương|Hồi|Quyển|Phần|Tiết|Chapter)\s*[\dIVXLCDM]+.*/i;

        function detectChapterTitleFromParagraphs(paragraphs, htmlDoc, fallbackTitle) {
            for (let i = 0; i < Math.min(10, paragraphs.length); i++) {
                const line = paragraphs.item ? paragraphs.item(i) : paragraphs.at(i);
                if (line && CHAPTER_REGEX.test(line.trim())) {
                    return line.trim().substring(0, 65);
                }
            }
            if (htmlDoc) {
                const headings = htmlDoc.querySelectorAll("h1, h2, h3, .chapter-title, .title");
                for (let h of headings) {
                    const t = h.textContent.replace(/\s+/g, ' ').trim();
                    if (t && !/^(unknown|untitled|chương mới|mục lục)$/i.test(t)) {
                        return t.substring(0, 65);
                    }
                }
            }
            if (paragraphs.length > 0) {
                return paragraphs.at(0).substring(0, 60);
            }
            return fallbackTitle;
        }

        function extractParagraphsFromHtml(htmlContent, fallbackTitle) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlContent, "text/html");
            doc.querySelectorAll("script, style, nav").forEach(el => el.remove());

            doc.querySelectorAll("br").forEach(br => br.replaceWith("\n"));
            doc.querySelectorAll("p, div, h1, h2, h3, h4, li, blockquote").forEach(el => {
                if (el.tagName === "DIV" && el.querySelector("p, div")) return;
                el.appendChild(doc.createTextNode("\n"));
            });

            const rawText = doc.body ? doc.body.textContent : doc.textContent;
            const paragraphs = processRawTextToChunks(rawText);
            const title = detectChapterTitleFromParagraphs(paragraphs, doc, fallbackTitle);
            return { title, paragraphs };
        }

        function processRawTextToChunks(rawText) {
            const rawLines = rawText.split(/\r?\n/);
            const cleanLines = [];
            const validCharRegex = /[a-zA-Z0-9àáảãạăắằẳẵặâấầẩẫậèéẻẽẹêếềểễệìíỉĩịòóỏõọôốồổỗộơớờởỡợùúủũụưứừửữựỳýỷỹỵđĐ]/;

            for (let line of rawLines) {
                let trimmed = line.replace(/\s+/g, ' ').trim();
                if (trimmed.length > 0 && trimmed.toLowerCase() !== "unknown" && validCharRegex.test(trimmed)) {
                    cleanLines.push(trimmed);
                }
            }

            const finalChunks = [];
            let currentBuf = "";

            for (let para of cleanLines) {
                if (para.length > MAX_LEN) {
                    if (currentBuf.trim() && validCharRegex.test(currentBuf)) {
                        finalChunks.push(currentBuf.trim());
                        currentBuf = "";
                    }
                    const sentences = para.split(/(?<=[.?!;…”"'])\s+/);
                    for (let s of sentences) {
                        if ((currentBuf + " " + s).trim().length > MAX_LEN) {
                            if (currentBuf.trim() && validCharRegex.test(currentBuf)) {
                                finalChunks.push(currentBuf.trim());
                            }
                            currentBuf = s;
                        } else {
                            currentBuf = (currentBuf + " " + s).trim();
                        }
                    }
                } else {
                    if ((currentBuf + " " + para).trim().length > MAX_LEN) {
                        if (currentBuf.trim() && validCharRegex.test(currentBuf)) {
                            finalChunks.push(currentBuf.trim());
                        }
                        currentBuf = para;
                    } else {
                        currentBuf = (currentBuf + " " + para).trim();
                    }
                }
            }

            if (currentBuf.trim() && validCharRegex.test(currentBuf)) {
                finalChunks.push(currentBuf.trim());
            }
            return finalChunks;
        }

        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files.item(0);
            if (!file) return;

            stopTTS();
            statusText.textContent = `⏳ Đang phân tích: ${file.name}...`;
            chapters = [];

            try {
                if (file.name.toLowerCase().endsWith('.txt')) {
                    const text = await file.text();
                    const splits = text.split(/(?=^(?:Chương|Hồi|Quyển|Chapter)\s*[\dIVXLCDM]+)/im);
                    if (splits.length <= 1) {
                        const paras = processRawTextToChunks(text);
                        chapters.push({
                            title: detectChapterTitleFromParagraphs(paras, null, "Toàn bộ nội dung"),
                            paragraphs: paras
                        });
                    } else {
                        splits.forEach((content, idx) => {
                            if (content.trim()) {
                                const paras = processRawTextToChunks(content);
                                if (paras.length > 0) {
                                    chapters.push({
                                        title: detectChapterTitleFromParagraphs(paras, null, `Chương ${idx + 1}`),
                                        paragraphs: paras
                                    });
                                }
                            }
                        });
                    }
                } else if (file.name.toLowerCase().endsWith('.epub')) {
                    const zip = await JSZip.loadAsync(file);
                    const containerFile = zip.file("META-INF/container.xml") || zip.file("meta-inf/container.xml");
                    if (!containerFile) throw new Error("File EPUB không hợp lệ");

                    const containerXml = await containerFile.async("text");
                    const parser = new DOMParser();
                    const containerDoc = parser.parseFromString(containerXml, "text/xml");
                    const opfPath = containerDoc.querySelector("rootfile").getAttribute("full-path");
                    const basePath = opfPath.includes('/') ? opfPath.substring(0, opfPath.lastIndexOf('/') + 1) : "";

                    const opfXml = await zip.file(opfPath).async("text");
                    const opfDoc = parser.parseFromString(opfXml, "text/xml");

                    const manifest = {};
                    opfDoc.querySelectorAll("manifest > item").forEach(item => {
                        manifest[item.getAttribute("id")] = item.getAttribute("href");
                    });

                    const spineItems = opfDoc.querySelectorAll("spine > itemref");
                    for (let i = 0; i < spineItems.length; i++) {
                        const href = manifest.hasOwnProperty(spineItems.item(i).getAttribute("idref"))
                            ? manifest[spineItems.item(i).getAttribute("idref")]
                            : null;
                        if (href) {
                            const filePath = basePath + decodeURIComponent(href);
                            const fileInZip = zip.file(filePath) || zip.file(filePath.replace(/^\//, ''));
                            if (fileInZip) {
                                const htmlContent = await fileInZip.async("text");
                                const extracted = extractParagraphsFromHtml(htmlContent, `Chương ${i + 1}`);
                                if (extracted.paragraphs.length > 0) {
                                    chapters.push(extracted);
                                }
                            }
                        }
                    }
                }

                if (chapters.length === 0) throw new Error("Không tìm thấy văn bản.");

                const cleanTitle = file.name.replace(/\.(txt|epub)$/i, "");
                currentBookId = "book_" + cleanTitle.toLowerCase().replace(/[^a-z0-9]/g, "_");
                currentBookTitle = cleanTitle;
                localStorage.setItem("last_open_book_id", currentBookId);
                document.getElementById("headerBookTitle").textContent = cleanTitle;

                await saveBookToDB({
                    id: currentBookId,
                    title: cleanTitle,
                    chapters: chapters,
                    lastChapter: 0,
                    lastChunk: 0,
                    updatedAt: Date.now()
                });

                populateChapterSelect();
                renderChapter(0, 0);
                statusText.textContent = `✅ Đã lưu vào Tủ sách (${chapters.length} chương)! Bấm ▶ để đọc.`;
            } catch (err) {
                statusText.textContent = `❌ Lỗi: ${err.message}`;
            }
        });

        function populateChapterSelect() {
            chapterSelect.innerHTML = "";
            chapters.forEach((chap, idx) => {
                const opt = document.createElement("option");
                opt.value = idx;
                opt.textContent = chap.title;
                chapterSelect.appendChild(opt);
            });
            chapterSelect.value = 0;
        }

        function onChapterChange() {
            const wasPlaying = isPlaying;
            stopTTS();
            renderChapter(parseInt(chapterSelect.value), 0);
            saveReadingProgress();
            if (wasPlaying) startTTS(0);
        }

        function renderChapter(index, startChunk = 0) {
            currentChapterIndex = index;
            const chap = chapters.at(currentChapterIndex);
            if (!chap) return;

            chunks = chap.paragraphs;
            currentChunkIndex = Math.min(startChunk, Math.max(0, chunks.length - 1));

            // Tách từng từ thành span để chạy chữ Karaoke
            storyContainer.innerHTML = chunks.map((text, idx) => {
                const words = text.split(/(\s+)/).map((token, wIdx) => {
                    if (/^\s+$/.test(token)) return token;
                    return `<span class="word-span" data-w="${wIdx}">${token}</span>`;
                }).join("");
                return `<p id="para-${idx}" onclick="startTTS(${idx})">${words}</p>`;
            }).join('');

            highlightParagraph(currentChunkIndex);
            updateProgressBar();
            clearAudioCache();
        }

        function updateProgressBar() {
            if (chunks.length === 0) {
                progressFill.style.width = "0%";
                return;
            }
            const pct = ((currentChunkIndex + 1) / chunks.length) * 100;
            progressFill.style.width = `${pct}%`;
        }

        // --- 4. ENGINE ÂM THANH, KARAOKE & CHẠY NỀN KHÔNG PIP ---
        const players = [new Audio(), new Audio()];
        players.forEach(p => {
            p.playsInline = true;
            p.preload = "auto";
        });

        // Kênh giữ nhịp ngầm (Silent Keep-Alive) giúp iOS Safari không ngắt tiếng khi thoát màn hình
        const keepAliveAudio = new Audio("data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA");
        keepAliveAudio.loop = true;
        keepAliveAudio.volume = 0.01;

        let isPlaying = false;
        let playSessionId = 0;
        let audioCache = {};
        let resolvedUrls = {};
        let activeControllers = {};
        let workerRunning = false;

        function clearAudioCache() {
            Object.values(activeControllers).forEach(ctrl => {
                try { ctrl.abort(); } catch (e) {}
            });
            activeControllers = {};
            audioCache = {};
            for (let key in resolvedUrls) {
                URL.revokeObjectURL(resolvedUrls[key]);
            }
            resolvedUrls = {};
        }

        async function fetchAudioSingle(text, index, session) {
            for (let attempt = 0; attempt < 3; attempt++) {
                if (session !== playSessionId) throw new Error("Cancelled");
                const controller = new AbortController();
                activeControllers[index] = controller;
                try {
                    const response = await fetch(getApiUrl(), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: text, voice: SELECTED_VOICE }),
                        signal: controller.signal
                    });
                    if (!response.ok) throw new Error("HTTP " + response.status);
                    const blob = await response.blob();
                    if (blob.size < 16) throw new Error("Empty audio");
                    return URL.createObjectURL(blob);
                } catch (err) {
                    if (session !== playSessionId || err.name === "AbortError") throw err;
                    if (attempt === 2) throw err;
                    await new Promise(r => setTimeout(r, 500));
                } finally {
                    delete activeControllers[index];
                }
            }
        }

        function ensureChunkPromise(index, session) {
            if (index >= chunks.length) return null;
            if (!audioCache[index]) {
                audioCache[index] = fetchAudioSingle(chunks.at(index), index, session).then(url => {
                    if (session === playSessionId) {
                        resolvedUrls[index] = url;
                        if (isPlaying && index === currentChunkIndex + 1) {
                            preloadAudioSlot(index, url);
                        }
                    }
                    return url;
                }).catch(err => {
                    delete audioCache[index];
                    throw err;
                });
            }
            return audioCache[index];
        }

        function preloadAudioSlot(index, url) {
            const slot = players[index % 2];
            if (slot.dataset.loadedIdx !== String(index)) {
                slot.src = url;
                slot.dataset.loadedIdx = String(index);
                slot.playbackRate = parseFloat(speedSelect.value);
                slot.load();
            }
        }

        async function startBackgroundWorker(startIdx, session) {
            if (workerRunning) return;
            workerRunning = true;
            try {
                while (session === playSessionId && isPlaying) {
                    const base = currentChunkIndex;
                    const limit = Math.min(chunks.length - 1, base + 3);
                    let target = -1;
                    for (let i = base; i <= limit; i++) {
                        if (!audioCache[i]) {
                            target = i;
                            break;
                        }
                    }
                    if (target === -1) break;
                    try {
                        await ensureChunkPromise(target, session);
                    } catch (e) {
                        await new Promise(r => setTimeout(r, 400));
                    }
                }
            } finally {
                workerRunning = false;
            }
        }

        function updateMediaSession() {
            if ('mediaSession' in navigator) {
                const chapTitle = chapters.at(currentChapterIndex)?.title || "Đang đọc truyện";
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: `${chapTitle} (${currentChunkIndex + 1}/${chunks.length})`,
                    artist: currentBookTitle,
                    album: "AI Story Reader"
                });
                navigator.mediaSession.setActionHandler('play', () => startTTS(currentChunkIndex));
                navigator.mediaSession.setActionHandler('pause', () => stopTTS());
                navigator.mediaSession.setActionHandler('previoustrack', () => prevChunk());
                navigator.mediaSession.setActionHandler('nexttrack', () => nextChunk());
            }
        }

        function togglePlayPause() {
            if (isPlaying) {
                stopTTS();
            } else {
                startTTS(currentChunkIndex);
            }
        }

        function prevChunk() {
            if (chunks.length === 0) return;
            const target = Math.max(0, currentChunkIndex - 1);
            startTTS(target);
        }

        function nextChunk() {
            if (chunks.length === 0) return;
            if (currentChunkIndex + 1 < chunks.length) {
                startTTS(currentChunkIndex + 1);
            } else if (currentChapterIndex + 1 < chapters.length) {
                currentChapterIndex++;
                chapterSelect.value = currentChapterIndex;
                renderChapter(currentChapterIndex, 0);
                startTTS(0);
            }
        }

        async function startTTS(startIndex = 0) {
            if (chunks.length === 0) {
                alert("Vui lòng chọn truyện từ Tủ sách hoặc bấm ＋ Thêm!");
                return;
            }

            playSessionId++;
            const currentSession = playSessionId;
            workerRunning = false;

            // Hủy các request cũ đang chạy dở nếu nhảy đoạn
            Object.values(activeControllers).forEach(ctrl => {
                try { ctrl.abort(); } catch (e) {}
            });
            activeControllers = {};

            players.forEach(p => {
                p.onended = null;
                p.onerror = null;
                p.ontimeupdate = null;
                p.pause();
                p.dataset.loadedIdx = "";
            });

            currentChunkIndex = startIndex;
            isPlaying = true;
            mainPlayBtn.textContent = "■";
            mainPlayBtn.classList.add("playing");

            keepAliveAudio.play().catch(() => {});
            updateMediaSession();

            await playLoop(currentSession);
        }

        async function playLoop(session) {
            while (isPlaying && session === playSessionId && currentChunkIndex < chunks.length) {
                const idx = currentChunkIndex;
                const activePlayer = players[idx % 2];

                highlightParagraph(idx);
                updateProgressBar();
                updateMediaSession();
                saveReadingProgress();

                if (!resolvedUrls[idx]) {
                    statusText.textContent = `⏳ Đang tạo giọng (${idx + 1}/${chunks.length})...`;
                }

                let audioUrl;
                try {
                    audioUrl = await ensureChunkPromise(idx, session);
                } catch (err) {
                    if (session !== playSessionId || !isPlaying) return;
                    statusText.textContent = `⚠️ Đang thử lại đoạn ${idx + 1}...`;
                    await new Promise(r => setTimeout(r, 700));
                    continue;
                }

                if (session !== playSessionId || !isPlaying) return;

                if (idx + 1 < chunks.length && resolvedUrls[idx + 1]) {
                    preloadAudioSlot(idx + 1, resolvedUrls[idx + 1]);
                }

                startBackgroundWorker(idx + 1, session);

                const chapTitle = chapters.at(currentChapterIndex)?.title || "";
                statusText.textContent = `🔊 ${chapTitle} (${idx + 1}/${chunks.length})`;
                await playOnSlot(activePlayer, idx, audioUrl, session);

                const oldIdx = idx - 2;
                if (oldIdx >= 0 && resolvedUrls[oldIdx]) {
                    URL.revokeObjectURL(resolvedUrls[oldIdx]);
                    delete resolvedUrls[oldIdx];
                    delete audioCache[oldIdx];
                }

                if (session !== playSessionId || !isPlaying) return;
                currentChunkIndex++;
            }

            if (isPlaying && session === playSessionId && currentChunkIndex >= chunks.length) {
                if (currentChapterIndex < chapters.length - 1) {
                    statusText.textContent = "⏭ Đang chuyển sang chương tiếp theo...";
                    currentChapterIndex++;
                    chapterSelect.value = currentChapterIndex;
                    renderChapter(currentChapterIndex, 0);
                    saveReadingProgress();
                    startTTS(0);
                    return;
                } else {
                    statusText.textContent = "🎉 Đã đọc hết toàn bộ truyện!";
                    stopTTS();
                }
            }
        }

        function playOnSlot(playerInstance, idx, url, session) {
            return new Promise((resolve) => {
                if (session !== playSessionId || !isPlaying) return resolve();

                playerInstance.onended = null;
                playerInstance.onerror = null;
                playerInstance.ontimeupdate = null;

                if (playerInstance.dataset.loadedIdx !== String(idx)) {
                    playerInstance.src = url;
                    playerInstance.dataset.loadedIdx = String(idx);
                }
                playerInstance.playbackRate = parseFloat(speedSelect.value);

                const paraEl = document.getElementById(`para-${idx}`);
                const wordSpans = paraEl ? Array.from(paraEl.querySelectorAll(".word-span")) : [];

                playerInstance.ontimeupdate = () => {
                    if (!playerInstance.duration || wordSpans.length === 0) return;
                    const ratio = Math.min(1, playerInstance.currentTime / playerInstance.duration);
                    const activeWordIdx = Math.floor(ratio * wordSpans.length);

                    wordSpans.forEach((sp, i) => {
                        if (i < activeWordIdx) {
                            sp.classList.add("spoken");
                            sp.classList.remove("current-word");
                        } else if (i === activeWordIdx) {
                            sp.classList.add("spoken", "current-word");
                        } else {
                            sp.classList.remove("spoken", "current-word");
                        }
                    });
                };

                const finish = () => {
                    playerInstance.onended = null;
                    playerInstance.onerror = null;
                    playerInstance.ontimeupdate = null;
                    wordSpans.forEach(sp => {
                        sp.classList.add("spoken");
                        sp.classList.remove("current-word");
                    });
                    resolve();
                };

                playerInstance.onended = finish;
                playerInstance.onerror = finish;
                playerInstance.play().catch(() => finish());
            });
        }

        function highlightParagraph(index) {
            document.querySelectorAll('#storyContainer p.active-chunk').forEach(p => {
                p.classList.remove('active-chunk');
                p.querySelectorAll('.word-span').forEach(sp => sp.classList.remove('spoken', 'current-word'));
            });
            const activePara = document.getElementById(`para-${index}`);
            if (activePara) {
                activePara.classList.add('active-chunk');
                activePara.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function updateSpeed() {
            const rate = parseFloat(speedSelect.value);
            players.forEach(p => p.playbackRate = rate);
        }

        function stopTTS(updateStatus = true) {
            playSessionId++;
            isPlaying = false;
            workerRunning = false;
            mainPlayBtn.textContent = "▶";
            mainPlayBtn.classList.remove("playing");
            keepAliveAudio.pause();

            players.forEach(p => {
                p.onended = null;
                p.onerror = null;
                p.ontimeupdate = null;
                p.pause();
                p.dataset.loadedIdx = "";
            });
            if (updateStatus) {
                statusText.textContent = "⏸ Đã tạm dừng.";
            }
        }

        // Tự động mở lại cuốn truyện đọc dở gần nhất khi mở trang
        window.addEventListener("DOMContentLoaded", async () => {
            if (currentBookId) {
                await loadSavedBook(currentBookId);
            }
        });
    </script>
</body>
