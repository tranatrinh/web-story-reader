<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Đọc Truyện Local AI Siêu Mượt</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        h2 { color: #bb86fc; text-align: center; }
        .container {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        textarea {
            width: 100%;
            height: 200px;
            background: #2d2d2d;
            color: #fff;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            resize: vertical;
            box-sizing: border-box;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        button {
            background-color: #bb86fc;
            color: #121212;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #9965f4; }
        button:disabled { background-color: #555; color: #888; cursor: not-allowed; }
        audio {
            width: 100%;
            margin-top: 20px;
        }
        .status {
            margin-top: 10px;
            font-style: italic;
            color: #03dac6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎧 Máy Đọc Truyện Local AI (Liên Tù Tì)</h2>
        
        <textarea id="storyText" placeholder="Dán nội dung truyện hoặc đoạn văn bản cần đọc vào đây...">Chương 1: Bữa tiệc xem mắt. Tôn Lôi Lôi lôi đồng ý xong là vội vàng đến nhà hàng. Không ngờ lúc Tôn Lôi Lôi vô cùng vui vẻ đi ăn buffet hải sản, trong lúc ăn thì gặp ngay người quen.</textarea>
        
        <div class="controls">
            <button id="readBtn" onclick="startReading()">▶ Đọc Liên Tục</button>
            <span id="statusText" class="status">Sẵn sàng...</span>
        </div>

        <audio id="audioPlayer" controls style="display:none;"></audio>
    </div>

    <script>
        async function startReading() {
            const text = document.getElementById('storyText').value.trim();
            const readBtn = document.getElementById('readBtn');
            const statusText = document.getElementById('statusText');
            const audioPlayer = document.getElementById('audioPlayer');

            if (!text) {
                alert("Vui lòng nhập nội dung văn bản!");
                return;
            }

            readBtn.disabled = true;
            statusText.textContent = "⏳ Local AI đang tổng hợp và ghép nối âm thanh liên tục...";
            audioPlayer.style.display = 'none';

            try {
                // Gửi toàn bộ đoạn văn lên server Flask ở cổng 5000
                const response = await fetch('http://127.0.0.1:5000/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });

                if (!response.ok) {
                    throw new Error("Lỗi kết nối tới Local AI Server!");
                }

                // Nhận cục file WAV liền mạch từ server
                const audioBlob = await response.blob();
                const audioUrl = URL.createObjectURL(audioBlob);

                audioPlayer.src = audioUrl;
                audioPlayer.style.display = 'block';
                statusText.textContent = "▶ Đang phát liên tù tì từ đầu đến cuối không ngắt quãng.";
                
                // Tự động phát luôn khi load xong
                await audioPlayer.play();

            } catch (error) {
                console.error(error);
                statusText.textContent = "❌ Lỗi: " + error.message;
            } finally {
                readBtn.disabled = false;
            }
        }
    </script>

</body>
</html>
