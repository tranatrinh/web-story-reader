<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Tunnel Story Reader - Final Background Play</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #e0e0e0; padding: 15px; margin: 0; }
        .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; align-items: center; background: #1e1e1e; padding: 15px; border-radius: 8px; border: 1px solid #333;}
        button { background-color: #3a3a3a; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold;}
        button:hover { opacity: 0.8; }
        .btn-play { background-color: #4CAF50; }
        .btn-stop { background-color: #f44336; }
        select, input[type="file"] { padding: 10px; background-color: #2d2d2d; color: white; border: 1px solid #555; border-radius: 5px; font-size: 14px; }
        textarea { width: 100%; height: 65vh; background-color: #1e1e1e; color: #f5f5f5; font-size: 18px; line-height: 1.6; padding: 15px; border: 1px solid #333; border-radius: 8px; box-sizing: border-box; resize: none; }
        #status { font-size: 14px; color: #ffeb3b; width: 100%; margin-top: 10px; font-weight: bold;}
    </style>
</head>
<body>

    <div class="toolbar">
        <input type="file" id="fileInput" accept=".txt,.epub" onclick="this.value=null;">
        
        <select id="chapterSelect" style="display: none;" onchange="loadSelectedChapter()">
            <option value="0">Đang phân tích...</option>
        </select>

        <select id="speedSelect" onchange="updateSpeed()">
            <option value="0.8">Chậm (0.8x)</option>
            <option value="1.0" selected>Bình thường (1.0x)</option>
            <option value="1.25">Hơi nhanh (1.25x)</option>
            <option value="1.5">Nhanh (1.5x)</option>
            <option value="1.75">Rất nhanh (1.75x)</option>
            <option value="2.0">Nhanh gấp đôi (2.0x)</option>
        </select>

        <button class="btn-play" onclick="startTTS()">▶ Đọc truyện</button>
        <button class="btn-stop" onclick="stopTTS()">■ Dừng</button>
        <div id="status">Sẵn sàng! Hãy chọn file truyện (.txt hoặc .epub).</div>
    </div>

    <textarea id="storyText" placeholder="Nội dung truyện sẽ hiển thị ở đây..."></textarea>

    <script>
        const fileInput = document.getElementById('fileInput'); 
        const storyText = document.getElementById('storyText'); 
        const status = document.getElementById('status'); 
        const chapterSelect = document.getElementById('chapterSelect');
        const speedSelect = document.getElementById('speedSelect');

        let chapters = [];
        let currentChapterIndex = 0;

        // --- ĐỌC VÀ TÁCH CHƯƠNG FILE ---
        fileInput.addEventListener('change', async (e) => { 
            const file = e.target.files[0]; 
            if (!file) return; 
            status.textContent = `⏳ Đang phân tích file: ${file.name}...`; 
            storyText.value = ""; 
            chapters = [];
            chapterSelect.style.display = "none";
            chapterSelect.innerHTML = "";

            try { 
                if (file.name.toLowerCase().endsWith('.txt')) { 
                    const text = await file.text(); 
                    const splits = text.split(/^(?=Chương\s+\d+|Hồi\s+\d+|Quyển\s+\d+)/im);
                    if (splits.length <= 1) {
                        chapters.push({ title: "Toàn bộ nội dung", content: text });
                    } else {
                        splits.forEach((content) => {
                            if (content.trim()) {
                                let title = content.trim().split('\n')[0].substring(0, 40) + "...";
                                chapters.push({ title: title, content: content.trim() });
                            }
                        });
                    }
                } else if (file.name.toLowerCase().endsWith('.epub')) { 
                    const zip = await JSZip.loadAsync(file); 
                    const containerXml = await zip.file("META-INF/container.xml").async("text"); 
                    const parser = new DOMParser(); 
                    const containerDoc = parser.parseFromString(containerXml, "text/xml"); 
                    const opfPath = containerDoc.querySelector("rootfile").getAttribute("full-path"); 
                    const basePath = opfPath.substring(0, opfPath.lastIndexOf('/') + 1); 
                    const opfXml = await zip.file(opfPath).async("text"); 
                    const opfDoc = parser.parseFromString(opfXml, "text/xml"); 
                    
                    const manifest = {}; 
                    opfDoc.querySelectorAll("manifest > item").forEach(item => { 
                        manifest[item.getAttribute("id")] = item.getAttribute("href"); 
                    }); 
                    const spineItems = opfDoc.querySelectorAll("spine > itemref"); 
                    
                    for (let i = 0; i < spineItems.length; i++) { 
                        const idref = spineItems[i].getAttribute("idref"); 
                        const href = manifest[idref]; 
                        if (href) { 
                            const filePath = basePath + decodeURIComponent(href); 
                            const fileInZip = zip.file(filePath); 
                            if (fileInZip) { 
                                const htmlContent = await fileInZip.async("text"); 
                                const htmlDoc = parser.parseFromString(htmlContent, "text/html"); 
                                const titleTag = htmlDoc.querySelector("title");
                                const title = titleTag && titleTag.textContent ? titleTag.textContent.trim() : `Phần ${i + 1}`;
                                const text = htmlDoc.body.textContent || htmlDoc.body.innerText; 
                                if(text.trim()) {
                                    chapters.push({ title: title, content: text.trim() });
                                }
                            } 
                        } 
                    } 
                }
                
                chapters.forEach((chap, idx) => {
                    const opt = document.createElement("option");
                    opt.value = idx;
                    opt.textContent = chap.title;
                    chapterSelect.appendChild(opt);
                });
                chapterSelect.style.display = "block";
                chapterSelect.value = 0;
                loadSelectedChapter();
                status.textContent = `✅ Đã tải xong ${chapters.length} chương! Bấm 'Đọc truyện' để phát.`; 
            } catch (err) { 
                status.textContent = `❌ Lỗi đọc file.`; 
            } 
        }); 

        function loadSelectedChapter() {
            currentChapterIndex = parseInt(chapterSelect.value);
            if(chapters[currentChapterIndex]) {
                storyText.value = chapters[currentChapterIndex].content;
                storyText.scrollTop = 0;
            }
        }

        // --- HỆ THỐNG WEB AUDIO API & CHẠY NGẦM ---
        let audioCtx = null;
        let isPlaying = false;
        let chunks = [];
        let currentChunkIndex = 0;
        let audioBuffers = []; 
        let currentSourceNode = null;

        function splitTextForAPI(text) {
            const lines = text.split(/\r?\n/);
            const result = [];
            let currentChunk = "";
            let currentLimit = 300; 
            let maxLimit = 600; // Giới hạn tối đa 600 ký tự để siêu tốc và không lỗi

            lines.forEach(line => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if ((currentChunk + "\n" + trimmed).length > currentLimit) {
                    if (currentChunk) {
                        result.push(currentChunk.trim());
                        if (currentLimit < maxLimit) currentLimit *= 1.5;
                    }
                    currentChunk = trimmed;
                } else {
                    currentChunk += (currentChunk ? "\n" : "") + trimmed;
                }
            });

            if (currentChunk) result.push(currentChunk.trim());
            return result.filter(ch => ch.length > 0);
        }

        async function fetchAudioBuffer(text, retries = 3) {
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch("https://comparing-tobacco-elvis-allied.trycloudflare.com/tts", {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: text })
                    });
                    if (!response.ok) throw new Error("Server error");
                    const arrayBuffer = await response.arrayBuffer();
                    return await audioCtx.decodeAudioData(arrayBuffer);
                } catch (err) {
                    if (i === retries - 1) throw err;
                    await new Promise(r => setTimeout(r, 600));
                }
            }
        }

        async function triggerParallelPrefetch() {
            if (!isPlaying) return;
            let promises = [];
            let lookAhead = 6;

            for (let i = currentChunkIndex; i <= Math.min(currentChunkIndex + lookAhead, chunks.length - 1); i++) {
                if (!audioBuffers[i] && !audioBuffers.fetchingFlags?.[i]) {
                    if (!audioBuffers.fetchingFlags) audioBuffers.fetchingFlags = {};
                    audioBuffers.fetchingFlags[i] = true;

                    promises.push(
                        fetchAudioBuffer(chunks[i]).then(buf => {
                            audioBuffers[i] = buf;
                            delete audioBuffers.fetchingFlags[i];
                        }).catch(() => {
                            if(audioBuffers.fetchingFlags) delete audioBuffers.fetchingFlags[i];
                        })
                    );
                }
            }
            if (promises.length > 0) {
                await Promise.allSettled(promises);
            }
        }

        function updateSpeed() {
            if (currentSourceNode && currentSourceNode.playbackRate) {
                currentSourceNode.playbackRate.value = parseFloat(speedSelect.value);
            }
        }

        async function startTTS() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }

            const text = storyText.value.trim();
            if (!text) { alert("Không có nội dung để đọc!"); return; }

            chunks = splitTextForAPI(text);
            if (chunks.length === 0) { alert("Văn bản không hợp lệ!"); return; }

            currentChunkIndex = 0;
            isPlaying = true;
            audioBuffers = new Array(chunks.length).fill(null);

            status.textContent = `⏳ Đang tải đoạn đầu tiên...`;

            try {
                // Tải duy nhất đoạn đầu để phát tức thì 0 delay
                audioBuffers[0] = await fetchAudioBuffer(chunks[0]);

                playSequence();
                triggerParallelPrefetch();
            } catch (err) {
                status.textContent = `⚠️ Lỗi kết nối server nhà. Đang thử lại...`;
                setTimeout(() => { if (isPlaying) startTTS(); }, 1500);
            }
        }

        async function playSequence() {
            if (!isPlaying) return;

            if (currentChunkIndex >= chunks.length) {
                if (currentChapterIndex < chapters.length - 1) {
                    status.textContent = "⏭ Đang chuyển chương tiếp theo...";
                    currentChapterIndex++;
                    chapterSelect.value = currentChapterIndex;
                    loadSelectedChapter();
                    setTimeout(() => { if (isPlaying) startTTS(); }, 100);
                } else {
                    status.textContent = "✅ Đã đọc hết truyện.";
                    isPlaying = false;
                    if ('mediaSession' in navigator) {
                        navigator.mediaSession.playbackState = "none";
                    }
                }
                return;
            }

            let currentTitle = `${chapters[currentChapterIndex].title} (${currentChunkIndex + 1}/${chunks.length})`;
            status.textContent = `🔊 Đang đọc (Hoài My Neural): ${currentTitle}`;

            // Kích hoạt Media Session để chạy ngầm khi khóa màn hình điện thoại
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: currentTitle,
                    artist: "Web Story Reader",
                    album: "Đọc truyện Hoài My Neural"
                });
                navigator.mediaSession.playbackState = "playing";
                navigator.mediaSession.setActionHandler('play', () => {
                    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                });
                navigator.mediaSession.setActionHandler('pause', () => {
                    stopTTS();
                });
            }

            while (isPlaying && !audioBuffers[currentChunkIndex]) {
                status.textContent = `⏳ Đang đồng bộ phần ${currentChunkIndex + 1}/${chunks.length}...`;
                triggerParallelPrefetch();
                await new Promise(r => setTimeout(r, 150));
            }

            if (!isPlaying) return;

            let buffer = audioBuffers[currentChunkIndex];
            audioBuffers[currentChunkIndex] = null; 

            currentSourceNode = audioCtx.createBufferSource();
            currentSourceNode.buffer = buffer;
            currentSourceNode.playbackRate.value = parseFloat(speedSelect.value);
            currentSourceNode.connect(audioCtx.destination);

            currentSourceNode.onended = () => {
                if (!isPlaying) return;
                currentChunkIndex++;
                playSequence(); 
            };

            currentSourceNode.start(0);
            triggerParallelPrefetch();
        }

        function stopTTS() {
            isPlaying = false;
            if (currentSourceNode) {
                try { currentSourceNode.stop(); } catch(e){}
            }
            audioBuffers = [];
            if ('mediaSession' in navigator) {
                navigator.mediaSession.playbackState = "none";
            }
            status.textContent = "⏹ Đã dừng đọc.";
        }
    </script>
</body>
</html>
