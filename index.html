<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Tunnel Story Reader - Highlight & Auto Scroll</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #e0e0e0; padding: 12px; margin: 0; box-sizing: border-box; }
        .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; background: #1e1e1e; padding: 12px; border-radius: 8px; border: 1px solid #333;}
        button { background-color: #3a3a3a; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold;}
        button:hover { opacity: 0.8; }
        .btn-play { background-color: #4CAF50; }
        .btn-stop { background-color: #f44336; }
        .btn-pip { background-color: #2196F3; }
        select, input[type="file"] { padding: 8px; background-color: #2d2d2d; color: white; border: 1px solid #555; border-radius: 5px; font-size: 14px; }
        
        /* Khung hiển thị truyện dạng danh sách đoạn văn để quét chữ */
        #storyContainer { width: 100%; height: 45vh; background-color: #1e1e1e; color: #aaa; font-size: 16px; line-height: 1.6; padding: 12px; border: 1px solid #333; border-radius: 8px; box-sizing: border-box; overflow-y: auto; margin-bottom: 10px; }
        #storyContainer p { margin: 12px 0; padding: 6px 8px; border-radius: 6px; transition: background-color 0.3s, color 0.3s; }
        
        #pipVideo { width: 100%; height: 180px; background: #000; border-radius: 8px; object-fit: cover; }
        #status { font-size: 13px; color: #ffeb3b; width: 100%; margin-top: 5px; font-weight: bold;}
    </style>
</head>
<body>

    <div class="toolbar">
        <input type="file" id="fileInput" accept=".txt,.epub" onclick="this.value=null;">
        
        <select id="chapterSelect" style="display: none;" onchange="loadSelectedChapter()">
            <option value="0">Đang phân tích...</option>
        </select>

        <select id="speedSelect" onchange="updateSpeed()">
            <option value="0.8">Chậm (0.8x)</option>
            <option value="1.0" selected>Bình thường (1.0x)</option>
            <option value="1.25">Hơi nhanh (1.25x)</option>
            <option value="1.5">Nhanh (1.5x)</option>
            <option value="1.75">Rất nhanh (1.75x)</option>
            <option value="2.0">Nhanh gấp đôi (2.0x)</option>
        </select>

        <button class="btn-play" onclick="startTTS()">▶ Đọc</button>
        <button class="btn-pip" onclick="togglePiP()">🔲 Bật PiP</button>
        <button class="btn-stop" onclick="stopTTS()">■ Dừng</button>
        <div id="status">Sẵn sàng! Hãy chọn file truyện (.txt hoặc .epub).</div>
    </div>

    <!-- Khung hiển thị văn bản quét chữ -->
    <div id="storyContainer">Nội dung truyện sẽ hiển thị ở đây sau khi bạn chọn file...</div>
    
    <video id="pipVideo" controls playsinline muted></video>

    <script>
        const fileInput = document.getElementById('fileInput'); 
        const storyContainer = document.getElementById('storyContainer'); 
        const status = document.getElementById('status'); 
        const chapterSelect = document.getElementById('chapterSelect');
        const speedSelect = document.getElementById('speedSelect');
        const pipVideo = document.getElementById('pipVideo');

        let chapters = [];
        let currentChapterIndex = 0;

        // --- XỬ LÝ CHỌN VÀ LOAD FILE TỐI ƯU ---
        fileInput.addEventListener('change', async (e) => { 
            const file = e.target.files[0]; 
            if (!file) return; 
            
            status.textContent = `⏳ Đang đọc file: ${file.name}...`; 
            storyContainer.innerHTML = "Đang tải nội dung..."; 
            chapters = [];
            chapterSelect.style.display = "none";
            chapterSelect.innerHTML = "";

            try { 
                if (file.name.toLowerCase().endsWith('.txt')) { 
                    const text = await file.text(); 
                    const splits = text.split(/(?=Chương\s+\d+|Hồi\s+\d+|Quyển\s+\d+|Chapter\s+\d+)/i);
                    
                    if (splits.length <= 1) {
                        chapters.push({ title: "Toàn bộ nội dung", content: text });
                    } else {
                        splits.forEach((content) => {
                            if (content.trim()) {
                                let firstLine = content.trim().split('\n')[0];
                                let title = firstLine.length > 40 ? firstLine.substring(0, 40) + "..." : firstLine;
                                chapters.push({ title: title, content: content.trim() });
                            }
                        });
                    }
                } else if (file.name.toLowerCase().endsWith('.epub')) { 
                    const zip = await JSZip.loadAsync(file); 
                    
                    const containerFile = zip.file("META-INF/container.xml") || zip.file("meta-inf/container.xml");
                    if (!containerFile) throw new Error("Không tìm thấy container.xml trong EPUB");
                    
                    const containerXml = await containerFile.async("text"); 
                    const parser = new DOMParser(); 
                    const containerDoc = parser.parseFromString(containerXml, "text/xml"); 
                    const rootfile = containerDoc.querySelector("rootfile");
                    if (!rootfile) throw new Error("Không tìm thấy rootfile trong EPUB");
                    
                    const opfPath = rootfile.getAttribute("full-path"); 
                    const basePath = opfPath.includes('/') ? opfPath.substring(0, opfPath.lastIndexOf('/') + 1) : ""; 
                    
                    const opfFile = zip.file(opfPath);
                    if (!opfFile) throw new Error("Không tìm thấy file OPF");
                    const opfXml = await opfFile.async("text"); 
                    const opfDoc = parser.parseFromString(opfXml, "text/xml"); 
                    
                    const manifest = {}; 
                    opfDoc.querySelectorAll("manifest > item").forEach(item => { 
                        manifest[item.getAttribute("id")] = item.getAttribute("href"); 
                    }); 
                    
                    const spineItems = opfDoc.querySelectorAll("spine > itemref"); 
                    
                    for (let i = 0; i < spineItems.length; i++) { 
                        const idref = spineItems[i].getAttribute("idref"); 
                        const href = manifest[idref]; 
                        if (href) { 
                            const filePath = basePath + decodeURIComponent(href); 
                            const fileInZip = zip.file(filePath) || zip.file(filePath.replace(/^\//, '')); 
                            if (fileInZip) { 
                                const htmlContent = await fileInZip.async("text"); 
                                const htmlDoc = parser.parseFromString(htmlContent, "text/html"); 
                                
                                let title = `Chương ${i + 1}`;
                                const titleTag = htmlDoc.querySelector("title");
                                const h1Tag = htmlDoc.querySelector("h1");
                                if (h1Tag && h1Tag.textContent.trim()) {
                                    title = h1Tag.textContent.trim();
                                } else if (titleTag && titleTag.textContent.trim()) {
                                    title = titleTag.textContent.trim();
                                }
                                
                                const text = htmlDoc.body ? (htmlDoc.body.textContent || htmlDoc.body.innerText) : htmlDoc.textContent; 
                                if(text && text.trim().length > 0) {
                                    chapters.push({ title: title.substring(0, 40), content: text.trim() });
                                }
                            } 
                        } 
                    } 
                }

                if (chapters.length === 0) {
                    chapters.push({ title: "Nội dung truyện", content: await file.text() });
                }
                
                chapters.forEach((chap, idx) => {
                    const opt = document.createElement("option");
                    opt.value = idx;
                    opt.textContent = chap.title;
                    chapterSelect.appendChild(opt);
                });
                chapterSelect.style.display = "block";
                chapterSelect.value = 0;
                loadSelectedChapter();
                status.textContent = `✅ Đã tải thành công ${chapters.length} chương!`; 
            } catch (err) { 
                console.error(err);
                status.textContent = `❌ Lỗi đọc file: ${err.message}`; 
            } 
        }); 

        function loadSelectedChapter() {
            currentChapterIndex = parseInt(chapterSelect.value);
            if(chapters[currentChapterIndex]) {
                const rawChunks = splitTextForAPI(chapters[currentChapterIndex].content);
                storyContainer.innerHTML = rawChunks.map((chunk, idx) => 
                    `<p id="para-${idx}">${chunk}</p>`
                ).join('');
                storyContainer.scrollTop = 0;
            }
        }

        let audioA = new Audio();
        let audioB = new Audio();
        let activeAudio = audioA;
        let nextAudio = audioB;

        let isPlaying = false;
        let chunks = [];
        let currentChunkIndex = 0;
        let nextBlobUrl = null;
        let canvasCtx = null;

        function setupCanvasStream() {
            const canvas = document.createElement('canvas');
            canvas.width = 400;
            canvas.height = 200;
            canvasCtx = canvas.getContext('2d');
            
            function draw() {
                if (!isPlaying) return;
                canvasCtx.fillStyle = '#111';
                canvasCtx.fillRect(0, 0, 400, 200);
                canvasCtx.fillStyle = '#ffeb3b';
                canvasCtx.font = 'bold 20px sans-serif';
                canvasCtx.fillText("Đang đọc truyện...", 20, 70);
                canvasCtx.fillStyle = '#fff';
                canvasCtx.font = '14px sans-serif';
                let title = chapters[currentChapterIndex] ? chapters[currentChapterIndex].title : "";
                canvasCtx.fillText(title.substring(0, 35), 20, 110);
                canvasCtx.fillText(`Phần: ${currentChunkIndex + 1} / ${chunks.length}`, 20, 140);
                requestAnimationFrame(draw);
            }
            draw();
            
            const stream = canvas.captureStream(30);
            pipVideo.srcObject = stream;
            pipVideo.play().catch(()=>{});
        }

        // --- TÁCH CHƯƠNG VÀ GOM NHÓM ĐOẠN VĂN AN TOÀN ---
        function splitTextForAPI(text) {
            let currentTitle = chapters[currentChapterIndex] ? chapters[currentChapterIndex].title : "Chương mới";
            
            const lines = text.split(/\r?\n/);
            const result = [];
            
            result.push(currentTitle);

            let currentChunk = "";
            let currentLimit = 300; 
            let maxLimit = 600;

            lines.forEach(line => {
                const trimmed = line.trim();
                if (!trimmed) return;
                if (trimmed === currentTitle) return;

                if ((currentChunk + "\n" + trimmed).length > currentLimit) {
                    if (currentChunk) {
                        result.push(currentChunk.trim());
                        if (currentLimit < maxLimit) currentLimit *= 1.4;
                    }
                    currentChunk = trimmed;
                } else {
                    currentChunk += (currentChunk ? "\n" : "") + trimmed;
                }
            });

            if (currentChunk) {
                result.push(currentChunk.trim());
            }

            return result.filter(ch => ch.length > 0);
        }

        async function getAudioBlob(text, retries = 3) {
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch("https://comparing-tobacco-elvis-allied.trycloudflare.com/tts", {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: text })
                    });
                    if (!response.ok) throw new Error("Server error");
                    const blob = await response.blob();
                    return URL.createObjectURL(blob);
                } catch (err) {
                    if (i === retries - 1) throw err;
                    await new Promise(r => setTimeout(r, 600));
                }
            }
        }

        function updateSpeed() {
            const rate = parseFloat(speedSelect.value);
            audioA.playbackRate = rate;
            audioB.playbackRate = rate;
        }

        async function togglePiP() {
            try {
                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                } else {
                    await pipVideo.requestPictureInPicture();
                }
            } catch (err) {
                alert("Hãy bấm nút 'Đọc' trước khi bật PiP nhé!");
            }
        }

        async function startTTS() { 
            const activeChapterText = chapters[currentChapterIndex] ? chapters[currentChapterIndex].content : "";
            if (!activeChapterText) { alert("Không có nội dung để đọc! Vui lòng chọn file truyện trước."); return; } 

            chunks = splitTextForAPI(activeChapterText); 
            if (chunks.length === 0) { alert("Văn bản không hợp lệ!"); return; }

            currentChunkIndex = 0;
            isPlaying = true;
            nextBlobUrl = null;
            
            audioA.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
            audioA.play().catch(() => {});

            setupCanvasStream();

            status.textContent = `⏳ Đang tải đoạn đầu...`;
            
            let firstUrl;
            try {
                firstUrl = await getAudioBlob(chunks[0]);
            } catch (err) {
                status.textContent = `⚠️ Lỗi kết nối server nhà.`;
                isPlaying = false;
                return;
            }

            if (!isPlaying) return;

            if (chunks.length > 1) {
                getAudioBlob(chunks[1]).then(url => { nextBlobUrl = url; }).catch(() => {});
            }

            playCurrentChunk(firstUrl);
        } 

        async function playCurrentChunk(url) {
            if (!isPlaying) return;

            activeAudio.src = url;
            activeAudio.playbackRate = parseFloat(speedSelect.value);
            
            let currentTitle = `${chapters[currentChapterIndex].title} (${currentChunkIndex + 1}/${chunks.length})`;
            status.textContent = `🔊 ${currentTitle}`;

            // --- TÍNH NĂNG QUÉT CHỮ & TỰ ĐỘNG CUỘN ---
            document.querySelectorAll('#storyContainer p').forEach(p => {
                p.style.backgroundColor = 'transparent';
                p.style.color = '#aaa';
            });
            
            const activePara = document.getElementById(`para-${currentChunkIndex}`);
            if (activePara) {
                activePara.style.backgroundColor = 'rgba(76, 175, 80, 0.2)'; // Màu xanh lá mờ nổi bật dòng đang đọc
                activePara.style.color = '#fff';
                activePara.style.fontWeight = 'bold';
                activePara.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            // ------------------------------------------

            if (nextBlobUrl && currentChunkIndex + 1 < chunks.length) {
                nextAudio.src = nextBlobUrl;
                nextAudio.playbackRate = parseFloat(speedSelect.value);
                nextAudio.load();
            }

            try {
                await activeAudio.play();
            } catch (e) {}

            if (!nextBlobUrl && currentChunkIndex + 2 < chunks.length) {
                getAudioBlob(chunks[currentChunkIndex + 2]).then(u => { nextBlobUrl = u; }).catch(() => {});
            }

            activeAudio.onended = async () => {
                URL.revokeObjectURL(url);
                currentChunkIndex++;

                if (!isPlaying) return;

                if (currentChunkIndex < chunks.length) {
                    if (nextBlobUrl) {
                        let temp = activeAudio;
                        activeAudio = nextAudio;
                        nextAudio = temp;
                        
                        let currentUrlToPlay = nextBlobUrl;
                        nextBlobUrl = null;

                        if (currentChunkIndex + 1 < chunks.length) {
                            getAudioBlob(chunks[currentChunkIndex + 1]).then(u => { nextBlobUrl = u; }).catch(() => {});
                        }

                        playCurrentChunk(currentUrlToPlay);
                    } else {
                        status.textContent = `⏳ Đang tải phần tiếp theo...`;
                        try {
                            const freshUrl = await getAudioBlob(chunks[currentChunkIndex]);
                            if (currentChunkIndex + 1 < chunks.length) {
                                getAudioBlob(chunks[currentChunkIndex + 1]).then(u => { nextBlobUrl = u; }).catch(() => {});
                            }
                            playCurrentChunk(freshUrl);
                        } catch (e) {
                            status.textContent = `⚠️ Thử lại phần ${currentChunkIndex + 1}...`;
                            setTimeout(() => { playCurrentChunk(url); }, 2000);
                        }
                    }
                } else {
                    if (currentChapterIndex < chapters.length - 1) {
                        status.textContent = "⏭ Đang chuyển chương...";
                        currentChapterIndex++;
                        chapterSelect.value = currentChapterIndex;
                        loadSelectedChapter();
                        setTimeout(() => { if (isPlaying) startTTS(); }, 100);
                    } else {
                        status.textContent = "✅ Đã đọc hết truyện.";
                        isPlaying = false;
                    }
                }
            };
        }

        function stopTTS() { 
            isPlaying = false;
            audioA.pause();
            audioB.pause();
            audioA.src = "";
            audioB.src = "";
            nextBlobUrl = null;
            status.textContent = "⏹ Đã dừng đọc."; 
        }
    </script>
</body>
</html>
