<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Story Reader Pro - Full Features</title>
    <script src="https://cloudflare.com"></script>
    <style>
        :root { --bg: #0b0f19; --card: #131b2e; --elev: #1e293b; --border: #283548; --text: #f1f5f9; --muted: #94a3b8; --accent: #10b981; }

        .p-btn { background: var(--accent); color: #042f2e; border: none; border-radius: 50%; width: 46px; height: 46px; font-size: 18px; font-weight: 700; cursor: pointer; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; align-items: flex-end; justify-content: center; z-index: 50; }
        .modal.open { display: flex; }
        .sheet { background: var(--card); border-top: 1px solid var(--border); border-radius: 18px 18px 0 0; width: 100%; max-width: 640px; max-height: 75dvh; display: flex; flex-direction: column; padding: 14px; gap: 10px; }
        .book-list { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .book-item { background: var(--elev); border: 1px solid var(--border); border-radius: 10px; padding: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }

    </style>
</head>
<body>
    <header>
        <div class="brand" id="bookTitle">🎧 Story Reader</div>
        <div class="actions">
            <button class="btn" onclick="openBookshelf()">📚 Tủ sách</button>
            <label class="btn btn-accent">＋ Mở file<input type="file" id="fileInput" accept=".txt,.epub" style="display:none;" onclick="this.value=null;"></label>
            <button class="btn" onclick="changeServerUrl()" title="Đổi Server">🔗 Server</button>
        </div>
    </header>
    <div class="sub-bar">
        <select id="chapterSelect" onchange="onChapterChange()"><option value="0">Chưa có chương nào</option></select>
    </div>
    <div id="storyContainer">
        <div style="text-align:center;color:#64748b;padding:40px 10px;font-family:sans-serif;">
            <div style="font-size:32px;margin-bottom:8px;">📖</div>
            <div><b>Chưa có truyện nào đang mở</b></div>
            <div style="font-size:13px;margin-top:6px;">Bấm <b>＋ Mở file</b> (.txt / .epub) hoặc chọn từ <b>📚 Tủ sách</b> để bắt đầu nghe.</div>
        </div>
    </div>
    <div class="dock">
        <div class="status-row"><div id="status">Sẵn sàng!</div><div id="chunkCounter">0 / 0</div></div>
        <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
        <div class="controls">
            <select id="voiceSelect" class="dock-sel" onchange="onVoiceChange()"><option value="default">🎙 Mặc định</option></select>
            <div class="transport">
                <button class="c-btn" onclick="prevChunk()">⏮</button>
                <button class="p-btn" id="mainPlayBtn" onclick="togglePlayPause()">▶</button>
                <button class="c-btn" onclick="nextChunk()">⏭</button>
            </div>
            <select id="speedSelect" class="dock-sel" onchange="updateSpeed()">
                <option value="0.8">0.8x</option><option value="1.0" selected>1.0x</option>
                <option value="1.25">1.25x</option><option value="1.5">1.5x</option>
                <option value="1.75">1.75x</option><option value="2.0">2.0x</option>
            </select>
        </div>
    </div>
    <div class="modal" id="bookshelfModal" onclick="if(event.target===this) closeBookshelf()">
        <div class="sheet">
            <div style="display:flex;justify-content:space-between;align-items:center;font-weight:700;">
                <span>📚 Tủ sách đã lưu trên máy</span>
                <button class="btn" onclick="closeBookshelf()">✕ Đóng</button>
            </div>
            <div class="book-list" id="bookList"></div>
        </div>
    </div>
    <script>
        let SERVER_BASE = localStorage.getItem("my_tts_server_url") || "http://localhost:5000";
        let SELECTED_VOICE = localStorage.getItem("my_tts_selected_voice") || "default";
        const MAX_LEN = 400;
        const getApiUrl = () => SERVER_BASE.replace(/\/$/, "") + "/tts";
        const getVoicesUrl = () => SERVER_BASE.replace(/\/$/, "") + "/voices";

        async function autoSyncTunnelUrl() {
            try {
                const res = await fetch("./tunnel.json?t=" + Date.now(), { cache: "no-store" });
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.url && data.url.startsWith("http")) {
                        SERVER_BASE = data.url.trim();
                        localStorage.setItem("my_tts_server_url", SERVER_BASE);
                        status.textContent = "✅ Đã đồng bộ Server: " + SERVER_BASE.replace(/^https?:\/\//, "");
                    }
                }
            } catch (e) {}
            await fetchAvailableVoices();
        }

        async function fetchAvailableVoices() {
            try {
                const res = await fetch(getVoicesUrl());
                if (!res.ok) return;
                const data = await res.json();
                if (data.voices && Array.isArray(data.voices)) {
                    const vs = document.getElementById('voiceSelect');
                    vs.innerHTML = "";
                    data.voices.forEach(v => {
                        const opt = document.createElement("option");
                        opt.value = v.id; opt.textContent = v.name; vs.appendChild(opt);
                    });
                    if ([...vs.options].some(o => o.value === SELECTED_VOICE)) vs.value = SELECTED_VOICE;
                    else SELECTED_VOICE = vs.value || "default";
                }
            } catch (e) {}
        }

        function onVoiceChange() {
            SELECTED_VOICE = document.getElementById('voiceSelect').value;
            localStorage.setItem("my_tts_selected_voice", SELECTED_VOICE);
            const wasPlaying = isPlaying, resumeIdx = currentChunkIndex;
            stopTTS(); clearAudioCache();
            if (wasPlaying) startTTS(resumeIdx);
            else status.textContent = "🎙 Giọng: " + (document.getElementById('voiceSelect').selectedOptions.item(0)?.text || SELECTED_VOICE);
        }

        function changeServerUrl() {
            let newUrl = prompt("Link Cloudflare Tunnel (để trống để tự đồng bộ GitHub):", SERVER_BASE);
if (newUrl !== null) {
if (newUrl.trim() === "") autoSyncTunnelUrl();
else { SERVER_BASE = newUrl.trim(); localStorage.setItem("my_tts_server_url", SERVER_BASE); clearAudioCache(); fetchAvailableVoices(); }
}
}
const openDB = () => new Promise((res, rej) => {
const req = indexedDB.open("AIStoryReaderDB", 1);
req.onupgradeneeded = e => { if (!e.target.result.objectStoreNames.contains("books")) e.target.result.createObjectStore("books", { keyPath: "id" }); };
req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error);
});
const saveBookToDB = async b => { const db = await openDB(); return new Promise((res, rej) => { const tx = db.transaction("books", "readwrite"); tx.objectStore("books").put(b); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); };
const getAllBooksFromDB = async () => { const db = await openDB(); return new Promise((res, rej) => { const tx = db.transaction("books", "readonly"); const r = tx.objectStore("books").getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); }); };
const getBookFromDB = async id => { const db = await openDB(); return new Promise((res, rej) => { const tx = db.transaction("books", "readonly"); const r = tx.objectStore("books").get(id); r.onsuccess = () => res(r.result || null); r.onerror = () => rej(r.error); }); };
const deleteBookFromDB = async id => { const db = await openDB(); return new Promise((res, rej) => { const tx = db.transaction("books", "readwrite"); tx.objectStore("books").delete(id); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); };
const fileInput = document.getElementById('fileInput'), storyContainer = document.getElementById('storyContainer'), status = document.getElementById('status'), chapterSelect = document.getElementById('chapterSelect'), speedSelect = document.getElementById('speedSelect'), mainPlayBtn = document.getElementById('mainPlayBtn'), progressFill = document.getElementById('progressFill'), chunkCounter = document.getElementById('chunkCounter'), bookTitleEl = document.getElementById('bookTitle');
let currentBookId = localStorage.getItem("last_active_book_id") || "", currentBookName = "", chapters = [], currentChapterIndex = 0, chunks = [], currentChunkIndex = 0;
const players = [new Audio(), new Audio()]; players.forEach(p => { p.playsInline = true; p.preload = "auto"; });
const keepAliveAudio = new Audio("data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA"); keepAliveAudio.loop = true; keepAliveAudio.volume = 0.01;
let isPlaying = false, playSessionId = 0, audioCache = {}, resolvedUrls = {}, abortControllers = {}, workerRunning = false, karaokeRaf = null, activeWordSpans = [];
const CHAPTER_REGEX = /^(?:Chương|Hồi|Quyển|Phần|Tiết|Chapter)\s*[\dIVXLCDM]+.*/i;
const updatePlayButtonUI = () => { mainPlayBtn.textContent = isPlaying ? "■" : "▶"; };
const togglePlayPause = () => isPlaying ? stopTTS() : startTTS(currentChunkIndex);
const prevChunk = () => { if (chunks.length > 0) startTTS(Math.max(0, currentChunkIndex - 1)); };
const nextChunk = () => {
if (chunks.length === 0) return;
if (currentChunkIndex + 1 < chunks.length) startTTS(currentChunkIndex + 1);
else if (currentChapterIndex + 1 < chapters.length) { currentChapterIndex++; chapterSelect.value = currentChapterIndex; renderChapter(currentChapterIndex); startTTS(0); }
};
async function saveProgress() {
if (!currentBookId) return;
try { const ex = await getBookFromDB(currentBookId); if (ex) { ex.lastChapter = currentChapterIndex; ex.lastChunk = currentChunkIndex; ex.updatedAt = Date.now(); await saveBookToDB(ex); } } catch (e) {}
}
function detectChapterTitle(paragraphs, htmlDoc, fallback) {
for (let i = 0; i < Math.min(10, paragraphs.length); i++) if (CHAPTER_REGEX.test(paragraphs[i].trim())) return paragraphs[i].trim().substring(0, 65);
if (htmlDoc) for (let h of htmlDoc.querySelectorAll("h1, h2, h3, .chapter-title, .title")) { const t = h.textContent.replace(/\s+/g, ' ').trim(); if (t && !/^(unknown|untitled|chương mới|mục lục)$/i.test(t)) return t.substring(0, 65); }
return paragraphs.length > 0 ? paragraphs.at(0).substring(0, 60) : fallback;
}
function extractHtml(htmlContent, fallback) {
const doc = new DOMParser().parseFromString(htmlContent, "text/html");
doc.querySelectorAll("script, style, nav").forEach(el => el.remove());
doc.querySelectorAll("br").forEach(br => br.replaceWith("\n"));
doc.querySelectorAll("p, div, h1, h2, h3, h4, li, blockquote").forEach(el => { if (!(el.tagName === "DIV" && el.querySelector("p, div, h1, h2, h3, h4"))) el.appendChild(doc.createTextNode("\n")); });
const paras = processRawText(doc.body ? doc.body.textContent : doc.textContent);
return { title: detectChapterTitle(paras, doc, fallback), paragraphs: paras };
}
function processRawText(rawText) {
const cleanLines = [], valid = /[a-zA-Z0-9àáảãạăắằẳẵặâấầẩẫậèéẻẽẹêếềểễệìíỉĩịòóỏõọôốồổỗộơớờởỡợùúủũụưứừửữựỳýỷỹỵđĐ]/;
for (let line of rawText.split(/\r?\n/)) {
let t = line.replace(/\s+/g, ' ').trim();
if (t.length > 0 && t.toLowerCase() !== "unknown" && valid.test(t)) {
if (cleanLines.length > 0) {
const prev = cleanLines[cleanLines.length - 1];
if (!/[.!?…:;”"'])]$/.test(prev) && /^[a-zàáảãạăắằẳẵặâấầẩẫậèéẻẽẹêếềểễệìíỉĩịòóỏõọôốồổỗộơớờởỡợùúủũụưứừửữựỳýỷỹỵđ,.;:!?)”"']/.test(t)) { cleanLines[cleanLines.length - 1] = prev + " " + t; continue; }
}
cleanLines.push(t);
}
}
const out = []; let buf = "";
for (let p of cleanLines) {
if (p.length > MAX_LEN) {
if (buf.trim() && valid.test(buf)) { out.push(buf.trim()); buf = ""; }
for (let s of p.split(/(?<=[.?!;…”"'])\s+/)) {
if ((buf + " " + s).trim().length > MAX_LEN) { if (buf.trim() && valid.test(buf)) out.push(buf.trim()); buf = s; }
else buf = (buf + " " + s).trim();
}
} else {
if ((buf + " " + p).trim().length > MAX_LEN) { if (buf.trim() && valid.test(buf)) out.push(buf.trim()); buf = p; }
else buf = (buf + " " + p).trim();
}
}
if (buf.trim() && valid.test(buf)) out.push(buf.trim());
return out;
}
fileInput.addEventListener('change', async (e) => {
const file = e.target.files.item(0); if (!file) return;
stopTTS(); status.textContent = ⏳ Đang nạp truyện: ${file.name}...;
let parsed = [];
try {
if (file.name.toLowerCase().endsWith('.txt')) {
const text = await file.text(), splits = text.split(/(?=^(?:Chương|Hồi|Quyển|Chapter)\s*[\dIVXLCDM]+)/im);
if (splits.length <= 1) { const p = processRawText(text); parsed.push({ title: detectChapterTitle(p, null, "Toàn bộ"), paragraphs: p }); }
else splits.forEach((c, i) => { if (c.trim()) { const p = processRawText(c); if (p.length > 0) parsed.push({ title: detectChapterTitle(p, null, Chương ${i + 1}), paragraphs: p }); } });
} else if (file.name.toLowerCase().endsWith('.epub')) {
const zip = await JSZip.loadAsync(file), cf = zip.file("META-INF/container.xml") || zip.file("meta-inf/container.xml");
if (!cf) throw new Error("EPUB không hợp lệ");
const parser = new DOMParser(), cDoc = parser.parseFromString(await cf.async("text"), "text/xml"), opfPath = cDoc.querySelector("rootfile").getAttribute("full-path"), base = opfPath.includes('/') ? opfPath.substring(0, opfPath.lastIndexOf('/') + 1) : "";
const opfDoc = parser.parseFromString(await zip.file(opfPath).async("text"), "text/xml"), manifest = {};
opfDoc.querySelectorAll("manifest > item").forEach(it => { manifest[it.getAttribute("id")] = it.getAttribute("href"); });
const spine = opfDoc.querySelectorAll("spine > itemref");
for (let i = 0; i < spine.length; i++) {
const href = manifest[spine[i].getAttribute("idref")];
if (href) { const fp = base + decodeURIComponent(href), fz = zip.file(fp) || zip.file(fp.replace(/^//, '')); if (fz) { const ex = extractHtml(await fz.async("text"), Chương ${i + 1}); if (ex.paragraphs.length > 0) parsed.push(ex); } }
}
}
if (parsed.length === 0) throw new Error("Không tìm thấy chữ.");
const name = file.name.replace(/.(txt|epub)$/i, ""), rec = { id: "book_" + Date.now(), name, chapters: parsed, lastChapter: 0, lastChunk: 0, updatedAt: Date.now() };
await saveBookToDB(rec); openBookObject(rec);
status.textContent = ✅ Đã lưu "${name}" vào Tủ sách!;
} catch (err) { status.textContent = ❌ Lỗi: ${err.message}; }
});
function openBookObject(b) {
stopTTS(); currentBookId = b.id; currentBookName = b.name; chapters = b.chapters;
localStorage.setItem("last_active_book_id", currentBookId); bookTitleEl.textContent = "🎧 " + currentBookName;
chapterSelect.innerHTML = ""; chapters.forEach((c, i) => { const o = document.createElement("option"); o.value = i; o.textContent = c.title; chapterSelect.appendChild(o); });
const sc = Math.min(b.lastChapter || 0, chapters.length - 1); chapterSelect.value = sc; renderChapter(sc);
if (b.lastChunk && b.lastChunk < chunks.length) { currentChunkIndex = b.lastChunk; highlightParagraph(currentChunkIndex); }
}
async function openBookshelf() {
document.getElementById('bookshelfModal').classList.add("open");
const listEl = document.getElementById('bookList'), books = (await getAllBooksFromDB()).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
listEl.innerHTML = books.length === 0 ? <div style="text-align:center;color:#64748b;padding:30px;">Tủ sách trống.</div> : books.map(b => <div class="book-item"><div class="book-info" onclick="selectBook('${b.id}')"><div class="book-title">${b.id === currentBookId ? '📖 ' : ''}${b.name}</div><div class="book-meta">${b.chapters.length} chương • Chương ${(b.lastChapter || 0) + 1}, Đoạn ${(b.lastChunk || 0) + 1}</div></div><button class="btn" style="color:#fca5a5;" onclick="delBook('${b.id}')">Xóa</button></div>).join('');
}
const closeBookshelf = () => document.getElementById('bookshelfModal').classList.remove("open");
const selectBook = async id => { const b = await getBookFromDB(id); if (b) { openBookObject(b); closeBookshelf(); } };
const delBook = async id => { if (!confirm("Xóa truyện này?")) return; await deleteBookFromDB(id); if (id === currentBookId) { stopTTS(); currentBookId = ""; chapters = []; chunks = []; bookTitleEl.textContent = "🎧 Story Reader"; storyContainer.innerHTML = ""; } openBookshelf(); };
function onChapterChange() { const wp = isPlaying; stopTTS(); renderChapter(parseInt(chapterSelect.value)); saveProgress(); if (wp) startTTS(0); }
function renderChapter(idx) {
currentChapterIndex = idx; const chap = chapters[idx]; if (!chap) return;
chunks = chap.paragraphs; currentChunkIndex = 0;
storyContainer.innerHTML = chunks.map((t, i) => <p id="para-${i}" onclick="startTTS(${i})">${t.split(/\s+/).map(w => ${w}).join(' ')}</p>).join('');
storyContainer.scrollTop = 0; chunkCounter.textContent = 1 / ${chunks.length}; progressFill.style.width = "0%"; clearAudioCache();
}
const abortAll = () => { for (let k in abortControllers) { try { abortControllers[k].abort(); } catch (e) {} } abortControllers = {}; };
const clearAudioCache = () => { abortAll(); audioCache = {}; for (let k in resolvedUrls) URL.revokeObjectURL(resolvedUrls[k]); resolvedUrls = {}; };
async function fetchAudioSingle(text, index, session) {
for (let attempt = 0; attempt < 3; attempt++) {
if (session !== playSessionId) throw new Error("Cancelled");
const ctrl = new AbortController(); abortControllers[index] = ctrl;
try {
const res = await fetch(getApiUrl(), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, voice: SELECTED_VOICE }), signal: ctrl.signal });
delete abortControllers[index]; if (!res.ok) throw new Error("HTTP " + res.status);
const blob = await res.blob(); if (blob.size < 16) throw new Error("Empty");
return URL.createObjectURL(blob);
} catch (err) { delete abortControllers[index]; if (err.name === "AbortError" || session !== playSessionId) throw new Error("Cancelled"); if (attempt === 2) throw err; await new Promise(r => setTimeout(r, 400)); }
}
}
function ensureChunkPromise(index, session) {
if (index >= chunks.length) return null;
if (!audioCache[index]) {
audioCache[index] = fetchAudioSingle(chunks[index], index, session).then(url => {
if (session === playSessionId) { resolvedUrls[index] = url; if (isPlaying && index === currentChunkIndex + 1) preloadSlot(index, url); }
return url;
}).catch(err => { delete audioCache[index]; throw err; });
}
return audioCache[index];
}
function preloadSlot(index, url) {
const slot = players[index % 2];
if (slot.dataset.loadedIdx !== String(index)) { slot.src = url; slot.dataset.loadedIdx = String(index); slot.playbackRate = parseFloat(speedSelect.value); slot.load(); }
}
async function startBgWorker(session) {
if (workerRunning) return; workerRunning = true;
try {
while (session === playSessionId && isPlaying) {
const limit = Math.min(chunks.length - 1, currentChunkIndex + 3);
let target = -1;
for (let i = currentChunkIndex; i <= limit; i++) if (!audioCache[i]) { target = i; break; }
if (target === -1) break;
try { await ensureChunkPromise(target, session); } catch (e) { await new Promise(r => setTimeout(r, 300)); }
}
} finally { workerRunning = false; }
}
function updateMediaSession(idx) {
if (!('mediaSession' in navigator)) return;
navigator.mediaSession.metadata = new MediaMetadata({ title: chapters[currentChapterIndex]?.title || "Đọc truyện", artist: ${currentBookName || "Story Reader"} (${idx + 1}/${chunks.length}), album: "VieNeu-TTS" });
navigator.mediaSession.playbackState = isPlaying ? "playing" : "paused";
navigator.mediaSession.setActionHandler('play', () => startTTS(currentChunkIndex));
navigator.mediaSession.setActionHandler('pause', () => stopTTS());
navigator.mediaSession.setActionHandler('previoustrack', () => prevChunk());
navigator.mediaSession.setActionHandler('nexttrack', () => nextChunk());
}
function startKaraoke(player, idx) {
if (karaokeRaf) cancelAnimationFrame(karaokeRaf);
const para = document.getElementById(para-${idx}); if (!para) return;
activeWordSpans = Array.from(para.querySelectorAll('.word-span'));
const weights = activeWordSpans.map(s => Math.max(2, s.textContent.length)), totalW = weights.reduce((a, b) => a + b, 0);
function tick() {
if (!isPlaying) return;
if (player.duration > 0) {
const ratio = Math.min(1, Math.max(0, player.currentTime / player.duration));
progressFill.style.width = ${(ratio * 100).toFixed(1)}%;
let acc = 0, act = 0;
for (let i = 0; i < weights.length; i++) { acc += weights[i]; if (acc >= ratio * totalW) { act = i; break; } }
for (let i = 0; i < activeWordSpans.length; i++) activeWordSpans[i].classList.toggle('spoken', i <= act);
}
karaokeRaf = requestAnimationFrame(tick);
}
karaokeRaf = requestAnimationFrame(tick);
}
async function startTTS(startIndex = 0) {
if (chunks.length === 0) { openBookshelf(); return; }
playSessionId++; const sess = playSessionId; workerRunning = false; abortAll();
players.forEach(p => { p.onended = null; p.onerror = null; p.pause(); p.dataset.loadedIdx = ""; });
currentChunkIndex = startIndex; isPlaying = true; updatePlayButtonUI(); saveProgress();
keepAliveAudio.play().catch(() => {});
const sil = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
players.forEach(p => { if (!p.src) p.src = sil; p.play().then(() => p.pause()).catch(() => {}); });
await playLoop(sess);
}
async function playLoop(session) {
while (isPlaying && session === playSessionId && currentChunkIndex < chunks.length) {
const idx = currentChunkIndex, slot = players[idx % 2];
highlightParagraph(idx); updateMediaSession(idx); saveProgress();
if (!resolvedUrls[idx]) status.textContent = ⏳ Đang tạo giọng (${idx + 1}/${chunks.length})...;
let url;
try { url = await ensureChunkPromise(idx, session); }
catch (e) { if (session !== playSessionId || !isPlaying) return; status.textContent = ⚠️ Thử lại đoạn ${idx + 1}...; await new Promise(r => setTimeout(r, 500)); continue; }
if (session !== playSessionId || !isPlaying) return;
if (idx + 1 < chunks.length && resolvedUrls[idx + 1]) preloadSlot(idx + 1, resolvedUrls[idx + 1]);
startBgWorker(session);
status.textContent = 🔊 ${chapters[currentChapterIndex].title};
await new Promise(res => {
if (session !== playSessionId || !isPlaying) return res();
slot.onended = null; slot.onerror = null;
if (slot.dataset.loadedIdx !== String(idx)) { slot.src = url; slot.dataset.loadedIdx = String(idx); }
slot.playbackRate = parseFloat(speedSelect.value); startKaraoke(slot, idx);
const done = () => { if (karaokeRaf) cancelAnimationFrame(karaokeRaf); progressFill.style.width = "100%"; slot.onended = null; slot.onerror = null; res(); };
slot.onended = done; slot.onerror = done; slot.play().catch(done);
});
const old = idx - 2; if (old >= 0 && resolvedUrls[old]) { URL.revokeObjectURL(resolvedUrls[old]); delete resolvedUrls[old]; delete audioCache[old]; }
if (session !== playSessionId || !isPlaying) return;
currentChunkIndex++;
}
if (isPlaying && session === playSessionId && currentChunkIndex >= chunks.length) {
if (currentChapterIndex < chapters.length - 1) { currentChapterIndex++; chapterSelect.value = currentChapterIndex; renderChapter(currentChapterIndex); startTTS(0); return; }
else { status.textContent = "✅ Đã đọc hết truyện!"; stopTTS(); }
}
}
function highlightParagraph(index) {
document.querySelectorAll('#storyContainer p.active-chunk').forEach(p => { p.classList.remove('active-chunk'); p.querySelectorAll('.word-span').forEach(s => s.classList.remove('spoken')); });
chunkCounter.textContent = ${index + 1} / ${chunks.length};
const el = document.getElementById(para-${index});
if (el) { el.classList.add('active-chunk'); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
}
const updateSpeed = () => { const r = parseFloat(speedSelect.value); players.forEach(p => p.playbackRate = r); };
function stopTTS() {
playSessionId++; isPlaying = false; workerRunning = false; abortAll(); if (karaokeRaf) cancelAnimationFrame(karaokeRaf); keepAliveAudio.pause();
players.forEach(p => { p.onended = null; p.onerror = null; p.pause(); p.dataset.loadedIdx = ""; });
updatePlayButtonUI(); if ('mediaSession' in navigator) navigator.mediaSession.playbackState = "paused"; status.textContent = "⏹ Đã dừng đọc.";
}
window.addEventListener('DOMContentLoaded', async () => {
await autoSyncTunnelUrl();
if (currentBookId) { const b = await getBookFromDB(currentBookId); if (b) { openBookObject(b); status.textContent = 📖 Khôi phục: ${b.name}; } }
});
