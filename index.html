<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local AI Story Reader - Trình Đọc Truyện Giọng Đọc AI</title>
    <!-- Tailwind CSS cho giao diện hiện đại -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Thư viện giải nén EPUB (JSZip) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Header / Thanh điều hướng -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold text-emerald-400 flex items-center gap-2">
            🎧 Local AI Story Reader
        </h1>
        <!-- Khung trạng thái: Bấm vào đây để thay đổi link Cloudflare Tunnel nhanh trên điện thoại -->
        <div id="connection-status" class="text-xs px-3 py-1 rounded bg-amber-500/20 text-amber-300 border border-amber-500/30 cursor-pointer hover:bg-amber-500/30 transition" title="Chạm để đổi link Server Tunnel">
            ● Chạm để cập nhật Link Server
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-6 flex flex-col gap-6">

        <!-- Khung công cụ / Tải file -->
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-wrap gap-4 items-center justify-between">
            <div class="flex items-center gap-3">
                <label class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-4 py-2 rounded-lg cursor-pointer transition flex items-center gap-2 shadow">
                    📂 Mở file TXT / EPUB
                    <input type="file" id="file-input" accept=".txt,.epub" class="hidden">
                </label>
                <span id="file-name" class="text-sm text-slate-400 italic">Chưa chọn file nào</span>
            </div>

            <div class="flex items-center gap-2">
                <button id="btn-play" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-2 rounded-lg transition shadow flex items-center gap-2">
                    ▶ Đọc Chương Này
                </button>
            </div>
        </div>

        <!-- Khung hiển thị / Đọc nội dung -->
        <div class="bg-slate-800 rounded-xl border border-slate-700 p-6 flex-1 flex flex-col shadow-inner min-h-[350px]">
            <h2 id="chapter-title" class="text-lg font-semibold text-emerald-300 mb-3 border-b border-slate-700 pb-2">
                Nội dung truyện
            </h2>
            <div id="content-display" class="flex-1 overflow-y-auto max-h-[400px] text-slate-300 leading-relaxed text-base pr-2 whitespace-pre-wrap font-sans">
                Vui lòng mở file văn bản (.txt) hoặc sách điện tử (.epub) để bắt đầu đọc truyện với giọng đọc AI chất lượng cao...
            </div>
        </div>

        <!-- Khung trình phát âm thanh (Audio Player) -->
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col gap-2">
            <div class="flex justify-between text-xs text-slate-400">
                <span id="audio-status">Trạng thái: Sẵn sàng</span>
                <span id="current-server-info" class="truncate max-w-[250px]">Server: Local</span>
            </div>
            <audio id="audio-player" controls class="w-full h-10 rounded-lg accent-emerald-500"></audio>
        </div>
    </main>

    <!-- JavaScript Xử Lý Đồng Bộ Link & Đọc Truyện -->
    <script>
        let SERVER_URL = localStorage.getItem("my_tts_server_url") || "http://localhost:5000";

        // Cập nhật giao diện trạng thái ban đầu
        function updateStatusUI() {
            const statusBadge = document.getElementById("connection-status");
            const serverInfo = document.getElementById("current-server-info");
            
            serverInfo.textContent = "Server: " + SERVER_URL;
            if (SERVER_URL.includes("trycloudflare.com")) {
                statusBadge.textContent = "● Đã kết nối Cloudflare";
                statusBadge.className = "text-xs px-3 py-1 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 cursor-pointer hover:bg-emerald-500/30 transition";
            } else {
                statusBadge.textContent = "● Chạm để đổi Link Server";
                statusBadge.className = "text-xs px-3 py-1 rounded bg-amber-500/20 text-amber-300 border border-amber-500/30 cursor-pointer hover:bg-amber-500/30 transition";
            }
        }

        // Tính năng bấm vào nhãn trạng thái để thay đổi link Cloudflare Tunnel trực tiếp trên điện thoại
        document.getElementById("connection-status").addEventListener("click", function() {
            let current = localStorage.getItem("my_tts_server_url") || "https://";
            let newUrl = prompt("Nhập đường dẫn Cloudflare Tunnel mới (Ví dụ: https://xxxx.trycloudflare.com):", current);
            if (newUrl) {
                SERVER_URL = newUrl.trim().replace(/\/$/, "");
                localStorage.setItem("my_tts_server_url", SERVER_URL);
                updateStatusUI();
                alert("Đã lưu đường dẫn server mới thành công!");
            }
        });

        // 2. Xử lý mở và phân tích file (TXT hoặc EPUB)
        document.getElementById('file-input').addEventListener('change', async function(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('file-name').textContent = file.name;
            const displayBox = document.getElementById('content-display');

            if (file.name.endsWith('.txt')) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    displayBox.textContent = e.target.result;
                };
                reader.readAsText(file, 'utf-8');
            } else if (file.name.endsWith('.epub')) {
                displayBox.textContent = "Đang giải nén và phân tích file EPUB...";
                try {
                    const zip = new JSZip();
                    const content = await zip.loadAsync(file);
                    let fullText = "";

                    for (let filename of Object.keys(content.files)) {
                        if (filename.endsWith('.html') || filename.endsWith('.xhtml') || filename.endsWith('.htm')) {
                            let htmlContent = await content.files[filename].async("text");
                            let parser = new DOMParser();
                            let doc = parser.parseFromString(htmlContent, 'text/html');
                            let paragraphs = doc.querySelectorAll('p, h1, h2, h3');
                            paragraphs.forEach(p => {
                                let txt = p.textContent.trim();
                                if (txt.length > 5) fullText += txt + "\n\n";
                            });
                        }
                    }

                    displayBox.textContent = fullText ? fullText : "Không tìm thấy nội dung văn bản hợp lệ trong EPUB.";
                } catch (err) {
                    alert("Lỗi đọc file EPUB: " + err.message);
                    displayBox.textContent = "Không thể phân tích file EPUB này.";
                }
            }
        });

        // 3. Xử lý gửi văn bản lên Flask Server để tổng hợp giọng nói
        document.getElementById('btn-play').addEventListener('click', async function() {
            const text = document.getElementById('content-display').textContent.trim();
            const audioStatus = document.getElementById('audio-status');
            const audioPlayer = document.getElementById('audio-player');

            if (!text || text.startsWith("Vui lòng mở file") || text.startsWith("Đang giải nén")) {
                alert("Vui lòng tải nội dung truyện hợp lệ trước khi bấm đọc!");
                return;
            }

            audioStatus.textContent = "Trạng thái: Đang tổng hợp giọng nói AI (Vui lòng đợi)...";
            
            try {
                let response = await fetch(`${SERVER_URL}/tts`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text.substring(0, 3000) }) // Giới hạn ký tự mỗi lần đọc
                });

                if (!response.ok) throw new Error("Lỗi phản hồi từ server TTS.");

                let audioBlob = await response.blob();
                let audioUrl = URL.createObjectURL(audioBlob);

                audioPlayer.src = audioUrl;
                audioPlayer.play();
                audioStatus.textContent = "Trạng thái: Đang phát âm thanh.";
            } catch (err) {
                alert("Không thể kết nối đến TTS Server: " + err.message + "\n\n(Hãy chắc chắn bạn đã chạm vào góc trên bên phải để cập nhật đúng Link Cloudflare Tunnel mới nhất!)");
                audioStatus.textContent = "Trạng thái: Lỗi kết nối server!";
            }
        });

        // Khởi chạy khi tải trang
        window.onload = function() {
            updateStatusUI();
        };
    </script>
</body>
</html>
